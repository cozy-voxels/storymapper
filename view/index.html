<!doctype html>
<html data-mode="view">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>StoryMapper</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
		rel="stylesheet">
</head>

<body>

	<!-- Read-only viewer: displays the data.json published next to this page.
	     Same markup as the editor (index.html) minus everything that creates,
	     imports, edits, or deletes. -->
	<div id="app">
		<div id="topbar">
			<div id="brand">
				<span class="mark">StoryMapper</span>
			</div>
			<nav id="placeholder-nav" aria-hidden="true">
				<span class="nav-pill" id="nav-library-pill">Story</span>
				<span class="nav-pill" id="nav-world-pill">World</span>
			</nav>
			<span class="save-status" id="save-status"></span>
			<div id="topbar-actions">
				<button class="theme-toggle" id="theme-toggle" type="button"
					aria-label="Switch between light and dark theme" title="Switch theme">
					<svg class="track-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
						stroke-linecap="round">
						<circle cx="12" cy="12" r="4.2"></circle>
						<path
							d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8">
						</path>
					</svg>
					<svg class="track-icon moon" viewBox="0 0 24 24" fill="currentColor">
						<path d="M20.4 14.7A8.3 8.3 0 0 1 9.3 3.6a8.6 8.6 0 1 0 11.1 11.1Z"></path>
					</svg>
					<span class="thumb" id="theme-thumb"></span>
				</button>
			</div>
		</div>

		<div id="quest-pill"></div>

		<div id="canvas-area">
			<aside id="linked-items-sidebar" aria-label="Linked items">
				<div class="sidebar-inner">
					<div class="sidebar-head">
						<h2>Linked items</h2>
						<button type="button" id="linked-items-sidebar-close" class="icon-btn" title="Close"
							aria-label="Close">&times;</button>
					</div>
					<div class="helptext">NPCs and Locations linked from any page in this quest/questline.</div>
					<div id="linked-items-list"></div>
				</div>
			</aside>
			<div id="viewport">
				<div id="world">
					<svg id="wires">
						<defs>
							<marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
								<path d="M0,0 L8,4 L0,8 Z" fill="var(--interact)"></path>
							</marker>
							<marker id="arrowhead-return" markerWidth="9" markerHeight="9" refX="7" refY="4"
								orient="auto">
								<path d="M0,0 L8,4 L0,8 Z" fill="var(--ink-faint)"></path>
							</marker>
						</defs>
					</svg>
					<div id="sections-layer"></div>
					<div id="cards-layer"></div>
				</div>
				<div id="linked-items-toggle">
					<button id="linked-items-btn" type="button" title="Linked items"
						aria-label="Toggle linked items panel" aria-pressed="false">&#128279;</button>
				</div>
				<div id="zoom-ctl">
					<button id="zoom-out" title="Zoom out">&minus;</button>
					<span id="zoom-pct" title="Reset to 100%">100%</span>
					<button id="zoom-in" title="Zoom in">+</button>
				</div>
			</div>
		</div>

		<div id="library-view">
			<div id="library-inner">
				<h1>Story</h1>
				<div class="library-section">
					<div class="library-section-head">
						<h2>Questlines</h2>
					</div>
					<div id="questline-groups"></div>
				</div>
				<div class="library-section">
					<div class="library-section-head">
						<h2>Standalone quests</h2>
					</div>
					<div id="standalone-quests"></div>
				</div>
			</div>
		</div>

		<div id="world-view">
			<div id="world-inner">
				<div id="world-directory">
					<h1>World</h1>

					<div class="library-section" id="world-section-factions">
						<div class="library-section-head">
							<h2>Factions</h2>
						</div>
						<div id="world-list-factions"></div>
					</div>

					<div class="library-section" id="world-section-npcs">
						<div class="library-section-head">
							<h2>NPCs</h2>
						</div>
						<div id="world-list-npcs"></div>
					</div>

					<div class="library-section" id="world-section-locations">
						<div class="library-section-head">
							<h2>Locations</h2>
						</div>
						<div id="world-list-locations"></div>
					</div>
				</div>

				<div id="world-detail" hidden>
					<div class="world-breadcrumb">
						<button type="button" id="world-detail-crumb-world">World</button>
						<span>/</span>
						<button type="button" id="world-detail-crumb-category"
							title="Back to this section in World"></button>
						<span>/</span>
						<span id="world-detail-crumb-name"></span>
					</div>

					<div id="world-detail-view-mode">
						<div class="world-detail-header">
							<div>
								<p class="world-detail-kind" id="world-detail-kind"></p>
								<h1 class="world-detail-title" id="world-detail-title"></h1>
							</div>
						</div>
						<div id="world-detail-fields"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="../src/view-main.js"></script>
</body>

</html>
