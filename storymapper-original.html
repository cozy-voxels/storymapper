<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>

<title>StoryMapper v0.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9e1c2;
    --bg-dot:#d6c99a;
    --surface:#f8f3e2;
    --surface-2:#fbf8ee;
    --ink:#221e17;
    --ink-soft:#5b5340;
    --ink-faint:#8a8067;
    --crimson:#5e1742;
    --crimson-ink:#471132;
    --crimson-soft:#e7dce3;
    --lilac:#6f5f9c;
    --lilac-soft:#ded6ee;
    --border:#c7b98a;
    --border-strong:#a99a68;
    --shadow:rgba(34,30,23,0.20);
    --focus:#3f6e8c;
    --interact:#9c3f8a;
    --interact-strong:#7a2f6c;
    --status-green:#2f7a4f;
    --status-green-soft:#dcecdf;
    --status-blue:#2f5f9c;
    --status-blue-soft:#dbe6f2;
    --header-bg:linear-gradient(155deg, var(--crimson) 0%, var(--crimson-ink) 130%);
    --header-name:#fbf3e2;
    --header-pageid:#f0cfe0;
    --header-border:var(--crimson-ink);
    --header-icon:rgba(251,243,226,0.78);
    --header-icon-hover:#fff6ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1120;
      --bg-dot:#161b30;
      --surface:#161c30;
      --surface-2:#111528;
      --ink:#eceff7;
      --ink-soft:#aeb5cc;
      --ink-faint:#727a99;
      --crimson:#ef7488;
      --crimson-ink:#ffa8b6;
      --crimson-soft:#33223a;
      --lilac:#b3a5ec;
      --lilac-soft:#292a4a;
      --border:#262c48;
      --border-strong:#38406a;
      --shadow:rgba(0,0,0,0.6);
      --focus:#8fc4e8;
      --interact:#e28ad4;
      --interact-strong:#f0abe3;
      --status-green:#7fd9a0;
      --status-green-soft:#1e3a2b;
      --status-blue:#8fc4e8;
      --status-blue-soft:#1c2c3f;
      --header-bg:linear-gradient(180deg, #33223a 0%, transparent 130%);
      --header-name:#eceff7;
      --header-pageid:#ffa8b6;
      --header-border:#262c48;
      --header-icon:#727a99;
      --header-icon-hover:#eceff7;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1120;
    --bg-dot:#161b30;
    --surface:#161c30;
    --surface-2:#111528;
    --ink:#eceff7;
    --ink-soft:#aeb5cc;
    --ink-faint:#727a99;
    --crimson:#ef7488;
    --crimson-ink:#ffa8b6;
    --crimson-soft:#33223a;
    --lilac:#b3a5ec;
    --lilac-soft:#292a4a;
    --border:#262c48;
    --border-strong:#38406a;
    --shadow:rgba(0,0,0,0.6);
    --focus:#8fc4e8;
    --interact:#e28ad4;
    --interact-strong:#f0abe3;
    --status-green:#7fd9a0;
    --status-green-soft:#1e3a2b;
    --status-blue:#8fc4e8;
    --status-blue-soft:#1c2c3f;
    --header-bg:linear-gradient(180deg, #33223a 0%, transparent 130%);
    --header-name:#eceff7;
    --header-pageid:#ffa8b6;
    --header-border:#262c48;
    --header-icon:#727a99;
    --header-icon-hover:#eceff7;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla',ui-sans-serif,system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  h1,h2,h3{text-wrap:balance;}

  /* ---------- layout shell ---------- */
  #app{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
  }

  /* ---------- top bar (minimal placeholder nav) ---------- */
  #topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:20px;
    padding:0 18px;
    height:52px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 var(--shadow);
    z-index:20;
  }
  #brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex:0 0 auto;
  }
  #brand .mark{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.01em;
    color:var(--crimson-ink);
  }
  #placeholder-nav{
    display:flex;
    gap:4px;
    flex:0 0 auto;
  }
  #placeholder-nav .nav-pill{
    font-size:12.5px;
    padding:6px 12px;
    border-radius:5px;
    color:var(--ink-faint);
    border:1px solid transparent;
    user-select:none;
  }
  #placeholder-nav .nav-pill.active{
    color:var(--ink);
    background:var(--surface);
    border-color:var(--border);
  }
  #placeholder-nav #nav-library-pill{cursor:pointer;}
  #placeholder-nav #nav-library-pill:hover{color:var(--interact-strong);}

  /* ---------- current context subheader (open quest/questline) ---------- */
  #quest-pill{
    flex:0 0 auto;
    padding:5px 20px;
    font-family:'Karla',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.03em;
    background:var(--header-bg);
    color:var(--header-name);
    border-bottom:1px solid var(--header-border);
  }
  #quest-pill:empty{display:none;}
  .save-status{
    flex:1 1 auto;
    font-size:10.5px;
    color:var(--ink-faint);
    opacity:0;
    transition:opacity .5s ease;
  }
  .save-status.show{opacity:1;}
  #topbar-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .btn{
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:5px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    line-height:1;
  }
  .btn:hover{border-color:var(--interact);color:var(--interact-strong);}
  .btn:focus-visible, button:focus-visible, .handle:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }
  .btn.primary{
    background:var(--interact);
    border-color:var(--interact);
    color:var(--surface-2);
  }
  .btn.primary:hover{background:var(--interact-strong);border-color:var(--interact-strong);color:var(--surface-2);}
  .btn.quiet-danger{background:none;border-color:transparent;color:var(--ink-faint);}
  .btn.quiet-danger:hover{background:var(--surface);border-color:var(--interact);color:var(--interact-strong);}
  .btn.quiet-danger.armed{background:var(--crimson-soft);border-color:var(--crimson);color:var(--crimson-ink);}

  /* ---------- topbar "Options" dropdown ---------- */
  .dropdown{position:relative;flex:0 0 auto;}
  .dropdown .caret{font-size:9px;position:relative;top:1px;}
  .dropdown-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    min-width:206px;
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:7px;
    padding:4px;
    box-shadow:0 6px 18px var(--shadow);
    z-index:30;
  }
  .dropdown-menu[hidden]{display:none;}
  .dropdown-item{
    font-size:12.5px;
    font-weight:600;
    text-align:left;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid transparent;
    background:none;
    color:var(--ink);
    cursor:pointer;
    line-height:1.2;
  }
  .dropdown-item:hover{background:var(--surface-2);color:var(--interact-strong);}
  /* "Clear cross-quest arrows" is the one destructive item in the menu, so
     it still gets a distinct hover treatment — but its resting text color
     matches every other item now, rather than starting out muted. */
  .dropdown-item.dropdown-item-danger:hover{background:var(--crimson-soft);color:var(--crimson-ink);}
  #file-input, #folder-input{display:none;}

  .theme-toggle{
    position:relative;
    flex:0 0 auto;
    width:46px;height:25px;
    border-radius:14px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    cursor:pointer;
    padding:0;
  }
  .theme-toggle .track-icon{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:12px;height:12px;
    color:var(--ink-faint);
  }
  .theme-toggle .track-icon.sun{left:5px;}
  .theme-toggle .track-icon.moon{right:5px;}
  .theme-toggle .thumb{
    position:absolute;
    top:2px;left:2px;
    width:19px;height:19px;
    border-radius:50%;
    background:var(--crimson);
    display:flex;align-items:center;justify-content:center;
    color:var(--surface-2);
    transition:left .18s ease, background .18s ease;
  }
  .theme-toggle .thumb svg{width:11px;height:11px;}
  :root[data-theme="dark"] .theme-toggle .thumb{left:23px;background:var(--lilac);}

  /* ---------- canvas ---------- */
  #viewport{
    position:relative;
    flex:1 1 auto;
    overflow:hidden;
    cursor:grab;
    background-image:radial-gradient(var(--bg-dot) 1.4px, transparent 1.4px);
    background-size:26px 26px;
  }
  #viewport.panning{cursor:grabbing;}
  #world{
    position:absolute;
    top:0;left:0;
    width:6000px;
    height:4200px;
    transform-origin:0 0;
  }
  svg#wires{
    position:absolute;
    top:0;left:0;
    width:6000px;
    height:4200px;
    pointer-events:none;
    overflow:visible;
  }
  svg#wires path.wire{
    fill:none;
    stroke:var(--interact);
    stroke-width:2.25;
    opacity:0.85;
    pointer-events:stroke;
  }
  svg#wires path.wire-hit{
    fill:none;
    stroke:transparent;
    stroke-width:16;
    pointer-events:stroke;
    cursor:pointer;
  }
  svg#wires path.wire.selected{stroke:var(--interact-strong);stroke-width:3;opacity:1;}
  svg#wires path.wire.wire-cross{stroke:var(--lilac);stroke-dasharray:2 6;stroke-linecap:round;}
  svg#wires path.wire.wire-cross.selected{stroke:var(--interact-strong);}
  /* When two pages link to each other, the arrow going the "other" direction
     (the later-added one of the pair — see computeMutualReturnIds) is drawn
     grey instead of the standard pink, so the primary/forward flow through
     the map still reads clearly at a glance. */
  svg#wires path.wire.wire-return{stroke:var(--ink-faint);}
  svg#wires path.wire.wire-return.selected{stroke:var(--interact-strong);}
  svg#wires path.wire-temp{
    fill:none;
    stroke:var(--interact);
    stroke-width:2.25;
    stroke-dasharray:6 5;
    opacity:0.9;
  }
  /* pointer-events:auto is not optional here — svg#wires sets pointer-events:none
     at the root (so the wires layer doesn't block clicks on the canvas
     underneath it), and that value inherits all the way down unless a
     descendant explicitly opts back in. Nothing here ever did, so both the
     × delete button and the ✎ label-edit button have been visually present
     but completely unclickable. */
  svg#wires g.wire-del{cursor:pointer;pointer-events:auto;}
  svg#wires g.wire-del circle{fill:var(--surface-2);stroke:var(--interact-strong);stroke-width:1.5;}
  svg#wires g.wire-del text{
    fill:var(--interact-strong);
    font-family:'Karla',sans-serif;
    font-size:13px;
    font-weight:700;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
  }
  /* Response text riding along a wire, so it's clear at a glance which
     response leads to which page when a card has more than one exit. */
  svg#wires g.wire-label{pointer-events:none;}
  svg#wires g.wire-label rect{
    fill:var(--surface-2);
    stroke:var(--interact);
    stroke-width:1;
    opacity:0.92;
  }
  svg#wires g.wire-label.cross rect{stroke:var(--lilac);}
  svg#wires g.wire-label text{
    fill:var(--ink-soft);
    font-family:'Karla',sans-serif;
    font-size:10.5px;
    font-weight:600;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
  }

  /* Floating HTML overlay (not SVG — it needs real text wrapping and click
     targets) offering a wire's source-page responses as its label. */
  .conn-label-chooser{
    position:fixed;
    z-index:60;
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:180px;
    max-width:280px;
    background:var(--surface-2);
    border:1px solid var(--interact);
    border-radius:8px;
    padding:6px;
    box-shadow:0 8px 24px rgba(0,0,0,0.28);
  }
  .conn-label-chooser .clc-head{
    font-family:'Karla',sans-serif;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-faint);
    padding:2px 8px 5px;
  }
  .conn-label-chooser button{
    all:unset;
    box-sizing:border-box;
    width:100%;
    cursor:pointer;
    font-family:'Karla',sans-serif;
    font-size:12.5px;
    color:var(--ink);
    padding:7px 8px;
    border-radius:5px;
  }
  .conn-label-chooser button:hover{background:var(--interact);color:var(--surface-2);}
  .conn-label-chooser button.clc-skip{
    color:var(--ink-faint);
    border-top:1px solid var(--header-border);
    margin-top:2px;
    padding-top:9px;
    border-radius:0 0 5px 5px;
  }

  /* ---------- card ---------- */
  .card{
    position:absolute;
    width:308px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    box-shadow:0 3px 10px var(--shadow);
    user-select:none;
    z-index:1;
  }
  .card.dragging{
    z-index:30;
    box-shadow:0 10px 26px var(--shadow);
    cursor:grabbing;
  }
  /* Shift-drag lasso selection — a temporary, unsaved grouping (unlike a
     Questline) that lets several cards be dragged together as one move. */
  .card.selected{
    outline:2px solid var(--interact);
    outline-offset:2px;
  }
  #marquee-box{
    position:fixed;
    border:1.5px dashed var(--interact);
    background:var(--lilac-soft);
    opacity:0.55;
    pointer-events:none;
    z-index:50;
    display:none;
  }
  .card-header{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    padding:11px 12px 9px;
    border-bottom:1px solid var(--header-border);
    background:var(--header-bg);
    border-radius:7px 7px 0 0;
    cursor:grab;
  }
  .card.dragging .card-header{cursor:grabbing;}
  .card-titles{min-width:0;}
  .card-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    line-height:1.22;
    color:var(--header-name);
    overflow-wrap:anywhere;
  }
  .card-pageid{
    margin-top:3px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--header-pageid);
    letter-spacing:0.01em;
    overflow-wrap:anywhere;
  }
  .icon-btn{
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    border-radius:5px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:12.5px;
    line-height:1;
  }
  .icon-btn:hover{background:var(--surface-2);border-color:var(--interact);color:var(--interact-strong);}
  .card-header .icon-btn{color:var(--header-icon);}
  .card-header .icon-btn:hover{background:var(--interact);border-color:transparent;color:var(--header-icon-hover);}
  /* Anchored inside the card body's own top-right corner, roughly level with
     the first field's label (e.g. "DIALOG") — not the header (the connection
     handles live there and crowd it) and not the card's outer bottom-right
     corner either (the "More" toggle for extra fields could land right under
     it, which read as wonky). card-body's own top padding already puts this
     at very nearly the same line as that first label. */
  .card-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:4;}
  .card-actions .icon-btn{
    background:var(--surface);
    border-color:var(--border);
    color:var(--ink-faint);
    box-shadow:0 1px 4px var(--shadow);
  }
  .card-actions .icon-btn:hover{background:var(--interact);border-color:transparent;color:var(--header-icon-hover);}

  .card-body{
    position:relative;
    padding:11px 12px 12px;
    font-size:13px;
    line-height:1.48;
    color:var(--ink);
    overflow-wrap:anywhere;
  }
  /* Only the very first field's label/text shares a line with the button —
     everything after it has already dropped below the button's bottom edge,
     so only this one block needs the extra clearance on the right. */
  .card-body > .field-block:first-child{padding-right:32px;}
  .field-block + .field-block{margin-top:9px;}
  .field-label{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:3px;
  }
  .field-prose{color:var(--ink);}
  .field-prose em{color:var(--ink-soft);}
  .tbd{
    color:var(--crimson-ink);
    border-bottom:1.5px dashed var(--crimson);
    padding:0 1px;
  }
  ul.bullet-list{list-style:none;margin:0;padding:0;}
  ul.bullet-list > li{
    position:relative;
    padding-left:15px;
    margin:4px 0;
  }
  ul.bullet-list > li::before{
    content:'';
    position:absolute;
    left:1px;top:7px;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--dot-color, var(--ink-faint));
  }
  ul.bullet-list.tone-response > li::before{background:var(--crimson);}
  ul.bullet-list.tone-note > li::before{background:var(--lilac);}
  ul.bullet-list li.label-line{padding-left:0;}
  ul.bullet-list li.label-line::before{display:none;}
  ul.bullet-list li.label-line{
    font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-faint);
    margin-top:8px;
  }
  ul.bullet-sub{list-style:none;margin:3px 0 0;padding:0 0 0 15px;}
  ul.bullet-sub > li{
    position:relative;
    padding-left:13px;
    margin:3px 0;
    font-size:12px;
    color:var(--ink-soft);
  }
  ul.bullet-sub > li::before{
    content:'\2192';
    position:absolute;left:0;top:0;
    color:var(--ink-faint);
    font-size:11px;
  }
  .journal{
    border-left:2.5px solid var(--lilac);
    padding:2px 0 2px 10px;
    font-style:italic;
    color:var(--ink-soft);
  }
  .kv-row{display:flex;gap:6px;font-size:12.5px;}
  .kv-row .k{color:var(--ink-faint);flex:0 0 auto;}
  .kv-row .v{color:var(--ink);}

  .expand-toggle{
    margin-top:10px;
    background:none;border:none;
    color:var(--interact);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.03em;
    cursor:pointer;
    padding:2px 0;
    display:flex;align-items:center;gap:4px;
  }
  .expand-toggle:hover{color:var(--interact-strong);}
  .card-extra{
    margin-top:8px;
    padding-top:9px;
    border-top:1px dashed var(--border);
  }
  .card-extra[hidden]{display:none;}

  .handle{
    position:absolute;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--surface-2);
    border:2px solid var(--interact);
    cursor:crosshair;
    z-index:5;
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease, background .12s ease;
  }
  .handle:hover{background:var(--interact);}
  .handle-top{top:0;left:50%;transform:translate(-50%,-50%);}
  .handle-left{left:0;top:50%;transform:translate(-50%,-50%);}
  .handle-right{right:0;top:50%;transform:translate(-50%,-50%);}
  .card:hover .handle,
  #viewport.connecting .handle{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- zoom control ---------- */
  #zoom-ctl{
    position:absolute;
    right:18px;bottom:18px;
    display:flex;
    align-items:center;
    gap:2px;
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-radius:20px;
    padding:4px;
    box-shadow:0 3px 10px var(--shadow);
    z-index:15;
  }
  #zoom-ctl button{
    width:26px;height:26px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #zoom-ctl button:hover{background:var(--surface);color:var(--interact-strong);}
  #zoom-pct{
    width:44px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    cursor:pointer;
  }

  /* ---------- edit modal ---------- */
  #modal-backdrop{
    position:fixed;inset:0;

**Herald of Port Haven**: Players revisit the fellow who greeted them in Port Haven. This time, he points them toward his twin brother, Gerald.

**Gerald**: Herald's twin brother, Merc Core member. Look very similar to the Herald, but dresses distinctly. Gruff, no patience for hand-holding, but not unkind about it.

## Goals

* Introduce Mercenary Core, Bondless, and one NPC's PoV on the factions
* Introduce mercenary contracts and give access to that quest board
  * Note: need probably 10-15 contracts written before starting this quest

<script>
(function(){
  "use strict";

  /* ================= state ================= */
  var state = {
    pages: [],         // Page (a dialog node): {id, x, y, title, pageId, fields:[{key,value}]} — "card" is only its on-canvas UI representation
    connections: [],   // {id, from, to}
    trash: [],         // soft-deleted pages: {page, deletedAt} — restorable, dropped with no connections
    nextPageId: 1,      // global monotonic counter (lives on the store, mirrored here) — never reset on quest switch
    nextConnId: 1,
    pan: {x: 60, y: 40},
    zoom: 1,
    selectedConn: null,
    editingCardId: null,
    // Ephemeral multi-select for a shift-drag "temp group" move — a lasso
    // selection, not a saved grouping like a Questline. Never persisted to
    // the store; cleared on every quest/questline switch.
    selectedCardIds: new Set(),
    view: 'canvas',         // 'canvas' | 'library'
    questId: null,
    questName: 'Untitled Quest',
    questlineId: null,        // a Quest may belong to a QuestLine (a group of quests) or stand alone
    activeQuestlineId: null,  // non-null only when the canvas is showing a WHOLE questline (merged view)
    questlineMembers: []      // [{questId, name}] — member quests of the active whole-questline view, in display order
  };

  var PRIMARY_KEYS = ['dialog', 'response(s)', 'responses'];

  var elWorld = document.getElementById('world');
  var elCardsLayer = document.getElementById('cards-layer');
  var elViewport = document.getElementById('viewport');
  var elWires = document.getElementById('wires');
  var elZoomPct = document.getElementById('zoom-pct');
  var elQuestPill = document.getElementById('quest-pill');
  var elSaveStatus = document.getElementById('save-status');

  /* ================= local persistence =================
     Quests are stored keyed by id so this schema already supports more
     than one saved quest, even though the UI to switch between them
     doesn't exist yet (that's a later step) — today only one quest is
     ever active at a time. A quest optionally belongs to a QuestLine
     (a group of related quests); there's no UI for that grouping yet
     either, but the field is there so quests can be tagged into one
     later without another migration. */
  var STORAGE_KEY = 'storymapper:quests:v1';
  var STORAGE_KEY_OLD = 'storymapper:boards:v1';

  function genId(){
    return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function defaultStore(){
    return {version: 2, activeQuestId: null, activeQuestlineId: null, quests: {}, questlines: {}, trashedQuests: [], trashedQuestlines: [], nextPageId: 1, nextConnId: 1, world: {factions: {}, npcs: {}, locations: {}}};
  }

  /* One-time migration from the pre-rename "boards" schema (cards ->
     pages, boardId -> questId) so anyone who already autosaved under the
     old key doesn't lose it. Global id counters and the questlines map
     are filled in afterward by ensureStoreShape(). */
  function migrateLegacyStore(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY_OLD);
      if(!raw) return null;
      var old = JSON.parse(raw);
      if(!old || typeof old !== 'object' || !old.boards) return null;
      var migrated = {version: 2, activeQuestId: old.activeBoardId || null, activeQuestlineId: null, quests: {}, questlines: {}};
      Object.keys(old.boards).forEach(function(id){
        var b = old.boards[id];
        migrated.quests[id] = {
          id: b.id,
          name: b.name,
          questlineId: null,
          pages: b.cards || [],
          connections: b.connections || [],
          trash: [],
          pan: b.pan,
          zoom: b.zoom,
          updatedAt: b.updatedAt
        };
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      localStorage.removeItem(STORAGE_KEY_OLD);
      return migrated;
    } catch(e){
      return null;
    }
  }

  /* Brings any previously-saved store up to the current schema: adds a
     questlines map if missing, and computes safe global nextPageId/
     nextConnId counters by scanning every quest's existing page and
     connection ids (needed because those counters used to live per-quest,
     which could never collide since only one quest was ever shown at a
     time — now that a whole questline can render several quests' pages
     together, ids must be unique across the whole store). */
  function ensureStoreShape(store){
    if(!store.questlines || typeof store.questlines !== 'object') store.questlines = {};
    if(typeof store.activeQuestlineId === 'undefined') store.activeQuestlineId = null;
    if(!Array.isArray(store.trashedQuests)) store.trashedQuests = [];
    if(!Array.isArray(store.trashedQuestlines)) store.trashedQuestlines = [];
    if(!store.world || typeof store.world !== 'object') store.world = {};
    if(!store.world.factions || typeof store.world.factions !== 'object') store.world.factions = {};
    if(!store.world.npcs || typeof store.world.npcs !== 'object') store.world.npcs = {};
    if(!store.world.locations || typeof store.world.locations !== 'object') store.world.locations = {};
    if(typeof store.nextPageId === 'number' && typeof store.nextConnId === 'number') return store;
    var maxPage = 0, maxConn = 0;
    function trackPage(id){
      var n = parseInt(String(id).replace(/^p/, ''), 10);
      if(!isNaN(n) && n > maxPage) maxPage = n;
    }
    function trackConn(id){
      var n = parseInt(String(id).replace(/^w/, ''), 10);
      if(!isNaN(n) && n > maxConn) maxConn = n;
    }
    Object.keys(store.quests || {}).forEach(function(qid){
      var q = store.quests[qid];
      (q.pages || []).forEach(function(p){ trackPage(p.id); });
      (q.connections || []).forEach(function(c){ trackConn(c.id); });
      (q.trash || []).forEach(function(t){ if(t.page) trackPage(t.page.id); });
    });
    (store.trashedQuests || []).forEach(function(entry){
      var q = entry.quest;
      if(!q) return;
      (q.pages || []).forEach(function(p){ trackPage(p.id); });
      (q.connections || []).forEach(function(c){ trackConn(c.id); });
      (q.trash || []).forEach(function(t){ if(t.page) trackPage(t.page.id); });
    });
    store.nextPageId = maxPage + 1;
    store.nextConnId = maxConn + 1;
    return store;
  }

  function loadStore(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && typeof parsed === 'object' && parsed.quests) return ensureStoreShape(parsed);
      }
      var migrated = migrateLegacyStore();
      return ensureStoreShape(migrated || defaultStore());
    } catch(e){
      return defaultStore();
    }
  }

  /* Returns true on success. A quota-exceeded or private-browsing write
     failure here used to be swallowed completely silently — callers that
     care (currently: questline folder import) now get a false back so they
     can tell the user their data didn't actually save, instead of it just
     quietly not being there next time they look. */
  function saveStore(store){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      return true;
    } catch(e){
      if(window.console && console.error) console.error('StoryMapper: could not save to localStorage', e);
      return false;
    }
  }

  /* Writes state.pages/connections/trash back into a single quest's
     record in the store. Used both for plain single-quest mode and,
     tagged per source quest, when splitting a merged questline view
     back apart on save. */
  function persistCurrentQuest(){
    var store = loadStore();
    var existingQuest = store.quests[state.questId];
    store.quests[state.questId] = {
      id: state.questId,
      name: state.questName,
      questlineId: state.questlineId,
      status: existingQuest ? existingQuest.status : undefined,
      pages: state.pages,
      connections: state.connections,
      trash: state.trash,
      pan: state.pan,
      zoom: state.zoom,
      updatedAt: Date.now()
    };
    store.activeQuestId = state.questId;
    store.activeQuestlineId = null;
    store.nextPageId = state.nextPageId;
    store.nextConnId = state.nextConnId;
    saveStore(store);
    flashSaved();
  }

  /* Splits the merged canvas state (pages/connections/trash tagged with
     ._questId) back into each member quest's own record, then saves.
     Connections tagged ._cross are questline-level data (span two
     different member quests) and are routed to the questline's own
     record instead of any single quest's. */
  function persistCurrentQuestline(){
    var store = loadStore();
    var crossConns = state.connections.filter(function(c){ return c._cross; }).map(function(c){
      var out = {id: c.id, from: c.from, to: c.to, fromSide: c.fromSide, toSide: c.toSide};
      if(c.label) out.label = c.label;
      return out;
    });
    // Each member quest's OWN record re-anchors its pages near the origin
    // (see below) so opening that quest alone doesn't start off past the
    // visible canvas — which means the block's actual position on the
    // shared questline canvas, e.g. where the user dragged its section box
    // to, has to be captured here separately or it's lost the moment this
    // save normalizes it away. Recorded per member, on the questline itself,
    // and fed back into layoutQuestlineSections() on the next open.
    var sectionPositions = {};
    state.questlineMembers.forEach(function(m){
      var memberPages = state.pages.filter(function(p){ return p._questId === m.questId; });
      if(!memberPages.length) return;
      var minX = Infinity, minY = Infinity;
      memberPages.forEach(function(p){
        if(p.x < minX) minX = p.x;
        if(p.y < minY) minY = p.y;
      });
      sectionPositions[m.questId] = {x: minX, y: minY};
    });
    state.questlineMembers.forEach(function(m){
      var existing = store.quests[m.questId] || {};
      var memberPages = state.pages.filter(function(p){ return p._questId === m.questId; });
      var trash = state.trash.filter(function(t){ return t._questId === m.questId; });
      var pageIds = {};
      memberPages.forEach(function(p){ pageIds[p.id] = true; });
      var connections = state.connections.filter(function(c){ return !c._cross && pageIds[c.from] && pageIds[c.to]; });
      // layoutQuestlineSections() stacks every member's pages one block
      // below the next on the shared whole-questline canvas, so by the time
      // a quest lower in the stack gets here its pages' x/y can be
      // thousands of pixels down. Saving that as-is into this quest's OWN
      // record used to bake the questline-wide offset in permanently — and
      // since opening a single quest always starts the camera at the same
      // fixed default pan, that quest's cards would sit off past the
      // visible canvas: it would *look* empty even though the pages were
      // all still there in storage. Re-anchor a copy near the origin instead
      // (a plain shift, so each quest's own internal layout is unaffected)
      // and leave the live, still-on-screen state.pages objects untouched so
      // this doesn't visibly reposition anything mid-edit.
      var minX = Infinity, minY = Infinity;
      memberPages.forEach(function(p){
        if(p.x < minX) minX = p.x;
        if(p.y < minY) minY = p.y;
      });
      var shiftX = (minX === Infinity ? 40 : minX) - 40;
      var shiftY = (minY === Infinity ? 40 : minY) - 40;
      var pages = memberPages.map(function(p){
        var clone = {};
        for(var key in p){ if(key !== '_questId') clone[key] = p[key]; }
        clone.x = p.x - shiftX;
        clone.y = p.y - shiftY;
        return clone;
      });
      store.quests[m.questId] = {
        id: m.questId,
        name: existing.name || m.name,
        questlineId: state.activeQuestlineId,
        status: existing.status,
        pages: pages,
        connections: connections,
        trash: trash,
        pan: existing.pan,
        zoom: existing.zoom,
        updatedAt: Date.now()
      };
    });
    if(store.questlines[state.activeQuestlineId]){
      store.questlines[state.activeQuestlineId].connections = crossConns;
      store.questlines[state.activeQuestlineId].sectionPositions = sectionPositions;
    }
    store.activeQuestId = null;
    store.activeQuestlineId = state.activeQuestlineId;
    store.nextPageId = state.nextPageId;
    store.nextConnId = state.nextConnId;
    saveStore(store);
    flashSaved();
  }

  function persistCurrent(){
    if(state.activeQuestlineId) persistCurrentQuestline();
    else persistCurrentQuest();
  }

  var autosaveTimer = null;
  function scheduleAutosave(){
    if(!state.questId && !state.activeQuestlineId) return;
    if(autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(function(){
      autosaveTimer = null;
      persistCurrent();
    }, 600);
  }

  var flashTimer = null;
  function flashStatus(text, ms){
    if(!elSaveStatus) return;
    elSaveStatus.textContent = text;
    elSaveStatus.classList.add('show');
    if(flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ elSaveStatus.classList.remove('show'); }, ms || 1600);
  }

  function flashSaved(){
    flashStatus('Saved to this browser', 1600);
  }

  function updateQuestPill(){
    if(!elQuestPill) return;
    if(state.activeQuestlineId){
      var store = loadStore();
      var ql = store.questlines[state.activeQuestlineId];
      elQuestPill.textContent = (ql ? ql.name : 'Questline') + ' (questline)';
    } else {
      elQuestPill.textContent = state.questName;
    }
  }

  /* ================= text formatting helpers ================= */
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Matches only the known style/color tags — {b} {i} {m} {/} and a 6-digit
  // {#hexcolor} — never a variable placeholder like {username},
  // {variable:max_arena2_bribe}, or {string:daily_harvesting_target}, which
  // all fail this pattern and pass through untouched.
  var STYLE_TAG_RE = /\{(#[0-9a-fA-F]{6}|\/|b|i|m)\}/g;

  function formatInline(raw){
    if(!raw) return '';
    var parts = raw.split(/(<br\s*\/?>)/i);
    var out = parts.map(function(part){
      if(/^<br\s*\/?>$/i.test(part)) return '<br>';
      var t = escapeHtml(part);
      t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
      // Card view only: drop the {b}/{i}/{m}/{/}/{#hex} style tags so the
      // text reads clean, same as the card title. Real variables (anything
      // else in braces) stay in place. The edit modal's textareas read
      // field.value directly, never through here, so raw tags are still
      // there to view and edit in full.
      t = t.replace(STYLE_TAG_RE, '');
      return t;
    });
    return out.join('').trim();
  }

  /* Card title only: strips {#hexcolor}/{b}/{/} style markup tags entirely
     rather than showing them as {tbd} pills, so the NPC name reads clean at
     a glance on the canvas. The edit modal's "NPC name" input reads page.title
     directly (never through this), so the raw markup is still there to view
     and edit in full. */
  function formatCardTitle(raw){
    if(!raw) return '';
    return escapeHtml(raw).replace(/\{[^}]+\}/g, '').trim();
  }

  function splitLines(raw){
    return raw.split(/<br\s*\/?>/i).map(function(l){return l.trim();}).filter(function(l){return l.length;});
  }

  /* Top-level response lines from a page's own Response(s) field (the "— "
     sub-lines under each one are actions/requirements, not choices) — used
     to offer response text as a connection label while hand-drawing a wire,
     the same way JSON import derives it from each Response's Text. */
  function responseChoicesForPage(page){
    var field = (page.fields || []).filter(function(f){ return f.key === 'Response(s)'; })[0];
    if(!field) return [];
    return splitLines(field.value)
      .filter(function(l){ return !/^—/.test(l); })
      .map(function(l){ return l.replace(/^-\s*/, '').trim(); })
      .filter(Boolean);
  }

  function renderBulletField(raw, tone){
    var lines = splitLines(raw);
    if(!lines.length) return '';
    var html = '<ul class="bullet-list tone-' + tone + '">';
    var openSub = false;
    lines.forEach(function(line){
      var isSub = /^—/.test(line);
      if(isSub){
        var subText = line.replace(/^—\s*/, '');
        if(!openSub){ html += '<ul class="bullet-sub">'; openSub = true; }
        html += '<li>' + formatInline(subText) + '</li>';
      } else {
        if(openSub){ html += '</ul>'; openSub = false; }
        var topText = line.replace(/^-\s*/, '');
        var isLabel = /:$/.test(topText) && !/^-/.test(line);
        html += '<li class="' + (isLabel ? 'label-line' : '') + '">' + formatInline(topText) + '</li>';
      }
    });
    if(openSub) html += '</ul>';
    html += '</ul>';
    return html;
  }

  function looksLikeBulletField(raw){
    return /(^|<br\s*\/?>)\s*[-—]/i.test(raw);
  }

  function renderSimpleList(items, tone){
    if(!items || !items.length) return '';
    var html = '<ul class="bullet-list tone-' + tone + '">';
    items.forEach(function(line){
      html += '<li>' + formatInline(line) + '</li>';
    });
    html += '</ul>';
    return html;
  }

  /* Splits a combined Note(s) cell into the discrete PageData fields it
     actually represents per ql_data-models.md: Requirements, Objectives,
     LoadActions. Anything left over (bare condition lines, "Npc req", etc.)
     falls back to Requirements, since that's what the "Requirement(s):"
     header in these notes has always meant. */
  function classifyNoteLines(raw){
    var lines = splitLines(raw);
    var reqs = [], objs = [], loads = [];
    lines.forEach(function(line){
      var stripped = line.replace(/^[-—]\s*/, '').trim();
      if(!stripped) return;
      if(/^requirement\(s\)\s*:?\s*$/i.test(stripped)) return;
      var mObj = stripped.match(/^objective\(s\)\s*:\s*(.*)$/i);
      if(mObj){ if(mObj[1].trim()) objs.push(mObj[1].trim()); return; }
      var mLoad = stripped.match(/^load\s*action\s*:\s*(.*)$/i);
      if(mLoad){ if(mLoad[1].trim()) loads.push(mLoad[1].trim()); return; }
      reqs.push(stripped);
    });
    return {reqs: reqs, objs: objs, loads: loads};
  }

  function expandNoteFields(fields){
    var out = [];
    fields.forEach(function(f){
      var keyLower = f.key.toLowerCase();
      if(keyLower === 'note(s)' || keyLower === 'notes'){
        var c = classifyNoteLines(f.value);
        if(c.reqs.length) out.push({key: 'Requirements', value: c.reqs.join(' <br> ')});
        if(c.objs.length) out.push({key: 'Objectives', value: c.objs.join(' <br> ')});
        if(c.loads.length) out.push({key: 'LoadActions', value: c.loads.join(' <br> ')});
        return;
      }
      out.push(f);
    });
    return out;
  }

  /* ================= markdown parsing ================= */
  function parseMarkdownTables(md){
    var lines = md.split('\n');
    var blocks = [];
    var current = null;
    lines.forEach(function(line){
      var trimmed = line.trim();
      if(trimmed.indexOf('|') === 0 || (trimmed.indexOf('|') > -1 && trimmed.lastIndexOf('|') === trimmed.length - 1)){
        if(!current){ current = []; }
        current.push(trimmed);
      } else {
        if(current && current.length){ blocks.push(current); }
        current = null;
      }
    });
    if(current && current.length) blocks.push(current);

    var tables = [];
    blocks.forEach(function(block){
      var rows = [];
      block.forEach(function(line){
        var cells = line.split('|');
        if(cells.length && cells[0].trim() === '') cells.shift();
        if(cells.length && cells[cells.length-1].trim() === '') cells.pop();
        cells = cells.map(function(c){return c.trim();});
        var isSeparator = cells.every(function(c){return /^:?-+:?$/.test(c);});
        if(isSeparator) return;
        if(cells.length >= 2){
          rows.push([cells[0], cells.slice(1).join(' | ')]);
        }
      });
      if(rows.length) tables.push(rows);
    });
    return tables;
  }

  function tablesToPages(tables){
    return tables.map(function(rows){
      var title = '', pageId = '', fields = [];
      rows.forEach(function(pair){
        var key = pair[0], val = pair[1];
        var keyLower = key.toLowerCase();
        if(keyLower === 'npc name' && !title){ title = val; return; }
        if(keyLower === 'page id' && !pageId){ pageId = val; return; }
        fields.push({key: key, value: val});
      });
      return {
        id: 'p' + (state.nextPageId++),
        title: title || 'Unnamed NPC',
        pageId: pageId || '—',
        fields: expandNoteFields(fields),
        x: 0, y: 0
      };
    });
  }

  function layoutPages(pages){
    var cols = 4, colGap = 380, rowGap = 340, startX = 40, startY = 30;
    pages.forEach(function(page, i){
      var row = Math.floor(i / cols);
      var colInRow = i % cols;
      var col = (row % 2 === 0) ? colInRow : (cols - 1 - colInRow);
      page.x = startX + col * colGap;
      page.y = startY + row * rowGap;
    });
  }

  /* Fits pan/zoom so every page's bounding box is framed in the viewport —
     called every time a quest or questline is opened from the library,
     rather than trusting a remembered or fixed-default pan/zoom. A stored
     position can point at empty space (most concretely: a quest saved back
     from the whole-questline view, whose pages can sit thousands of pixels
     down its stacked layout — see persistCurrentQuestline), and a fixed
     default doesn't help once a quest's layout has grown past one screen.
     Card height is content-dependent and only known post-render, so this
     uses a fixed estimate — approximate framing, not pixel-perfect, is the
     goal here. */
  function fitViewToPages(pages){
    if(!pages || !pages.length){
      state.pan = {x: 60, y: 40};
      state.zoom = 1;
      return;
    }
    var CARD_H_EST = 260;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pages.forEach(function(p){
      if(p.x < minX) minX = p.x;
      if(p.y < minY) minY = p.y;
      if(p.x + CARD_W > maxX) maxX = p.x + CARD_W;
      if(p.y + CARD_H_EST > maxY) maxY = p.y + CARD_H_EST;
    });
    var PAD = 60;
    var contentW = (maxX - minX) + PAD * 2;
    var contentH = (maxY - minY) + PAD * 2;
    // elViewport may still be display:none at this point (switchToQuest and
    // switchToQuestline now show it first, but this stays defensive in case
    // that ever changes) — clientWidth/Height read 0 then, and 0 is falsy,
    // so this quietly falls back to an assumed reasonable window size rather
    // than computing a zoom of Infinity.
    var vw = elViewport.clientWidth || 1000;
    var vh = elViewport.clientHeight || 700;
    var zoom = Math.min(vw / contentW, vh / contentH, 1.25);
    zoom = Math.max(0.15, zoom);
    var centerX = minX + (maxX - minX) / 2;
    var centerY = minY + (maxY - minY) / 2;
    state.zoom = zoom;
    state.pan = {
      x: vw / 2 - centerX * zoom,
      y: vh / 2 - centerY * zoom
    };
  }

  function sequentialConnections(pages){
    var conns = [];
    for(var i = 0; i < pages.length - 1; i++){
      var a = pages[i], b = pages[i+1];
      var forward = b.x >= a.x;
      conns.push({
        id: 'w' + (state.nextConnId++),
        from: a.id, to: b.id,
        fromSide: forward ? 'right' : 'left',
        toSide: forward ? 'left' : 'right'
      });
    }
    return conns;
  }

  /* ================= JSON quest import (QuestLines mod format) =================
     Imports the real quest JSON files under QuestLines/quests (including
     questline subfolders), as opposed to the hand-authored draft .md tables.
     Field text is carried over literally,
     including the game's {#hex}/{b}/{i} inline formatting codes — the app
     doesn't yet know how to render those (only markdown-style bold/italic
     and {TBD} placeholders), so they'll show as raw text for now. */

  function jsonLinesToBr(s){
    return String(s).replace(/\r\n|\r|\n/g, ' <br> ');
  }

  /* Finds every `page:<id>` action in an actions array — that's the real
     same-quest dialogue jump, distinct from the Pages array's listed order. */
  function findPageRefs(actionsArr){
    var refs = [];
    (actionsArr || []).forEach(function(a){
      var m = /^page:(.+)$/.exec(String(a).trim());
      if(m) refs.push(m[1]);
    });
    return refs;
  }

  /* Finds every quest-state gate (questStarted:/questCompleted:/etc.) in a
     requirements array that points at a DIFFERENT quest — used to auto-draw
     cross-quest connections when importing a whole questline folder. */
  function findQuestStateRefs(reqsArr){
    var refs = [];
    (reqsArr || []).forEach(function(r){
      var m = /^quest(Started|Completed|NotStarted|NotCompleted):(.+)$/.exec(String(r).trim());
      if(m) refs.push({raw: r, questId: m[2]});
    });
    return refs;
  }

  /* Builds {pages, connections} from one parsed quest JSON object. Pages are
     NOT laid out here (x/y stay 0) — the caller decides layout, since a
     re-import needs to preserve existing positions rather than reflow
     everything. Connections ARE built here since they don't depend on
     layout, following page: action references with a sequential fallback
     for any page that page: never reaches (so nothing is left floating). */
  function buildQuestFromJson(qj){
    var pageIds = (qj.Pages && qj.Pages.length) ? qj.Pages.slice() : Object.keys(qj.PageData || {});
    var idByPageId = {};
    var pages = pageIds.map(function(pid){
      var internalId = 'p' + (state.nextPageId++);
      idByPageId[pid] = internalId;
      return {id: internalId, pageId: pid, title: (qj.PageData && qj.PageData[pid] && qj.PageData[pid].Name) || pid, fields: [], x: 0, y: 0};
    });

    pages.forEach(function(page){
      var pd = (qj.PageData && qj.PageData[page.pageId]) || {};
      var fields = [];
      if(pd.Dialog) fields.push({key: 'Dialog', value: jsonLinesToBr(pd.Dialog)});
      if(pd.JournalText) fields.push({key: 'JournalText', value: jsonLinesToBr(pd.JournalText)});
      if(pd.Responses && pd.Responses.length){
        var lines = [];
        pd.Responses.forEach(function(r){
          lines.push('- ' + (r.Text || ''));
          (r.Requirements || []).forEach(function(rq){ lines.push('— requires: ' + rq); });
          (r.Actions || []).forEach(function(a){ lines.push('— ' + a); });
        });
        fields.push({key: 'Response(s)', value: lines.join(' <br> ')});
      }
      if(pd.Requirements && pd.Requirements.length) fields.push({key: 'Requirements', value: pd.Requirements.join(' <br> ')});
      if(pd.Objectives && pd.Objectives.length) fields.push({key: 'Objectives', value: pd.Objectives.join(' <br> ')});
      if(pd.LoadActions && pd.LoadActions.length) fields.push({key: 'LoadActions', value: pd.LoadActions.join(' <br> ')});
      page.fields = fields;
    });

    var connections = [];
    var touched = {};
    pages.forEach(function(page){
      var pd = (qj.PageData && qj.PageData[page.pageId]) || {};
      // Track which response (if any) produced each page: ref, so the arrow
      // can be labeled with it — a card with two responses that lead to two
      // different pages otherwise draws two unlabeled arrows with no way to
      // tell which choice goes where.
      var refs = findPageRefs(pd.LoadActions).map(function(toPid){
        return {toPid: toPid, label: null};
      });
      (pd.Responses || []).forEach(function(r){
        findPageRefs(r.Actions).forEach(function(toPid){
          refs.push({toPid: toPid, label: r.Text || null});
        });
      });
      refs.forEach(function(ref){
        var toId = idByPageId[ref.toPid];
        if(!toId || toId === page.id) return;
        var exists = connections.some(function(c){ return c.from === page.id && c.to === toId; });
        if(exists) return;
        var conn = {id: 'w' + (state.nextConnId++), from: page.id, to: toId, fromSide: 'right', toSide: 'left'};
        if(ref.label) conn.label = ref.label;
        connections.push(conn);
        touched[page.id] = true;
        touched[toId] = true;
      });
    });
    // Fallback: a page that page: never reaches or leaves would otherwise be
    // stranded with no arrows at all — connect it to the next page in the
    // Pages array's listed order, same as the .md importer does for every page.
    pages.forEach(function(page, idx){
      if(touched[page.id]) return;
      var next = pages[idx + 1];
      if(next) connections.push({id: 'w' + (state.nextConnId++), from: page.id, to: next.id, fromSide: 'right', toSide: 'left'});
    });

    // The Pages array in the source JSON is often listed in whatever order
    // the mod author happened to write the pages, not the order they're
    // actually visited in play — laying out by that raw order tends to run
    // the dialogue backwards. Reorder for layout purposes by walking the
    // arrows we just built instead: start from the page(s) nothing points
    // at (the real entry point) and follow page: connections outward, so
    // the grid reads left-to-right/top-to-bottom the way the quest is
    // actually played.
    pages = orderPagesByFlow(pages, connections);

    return {pages: pages, connections: connections, meta: {description: qj.Description, repeatable: !!qj.Repeatable, rewards: qj.Rewards}};
  }

  /* Reorders pages by walking outgoing page: connections breadth-first from
     the page(s) with no incoming connection (the entry point(s)) — used so
     layoutPages(), which places pages into its grid in array order, follows
     the actual dialogue flow rather than the source JSON's listed order.
     Anything a cycle or missing root leaves unreachable keeps its original
     relative order, appended after the main flow rather than dropped. */
  function orderPagesByFlow(pages, connections){
    var outgoing = {}, incoming = {}, byId = {};
    pages.forEach(function(p){ outgoing[p.id] = []; incoming[p.id] = 0; byId[p.id] = p; });
    connections.forEach(function(c){
      if(outgoing[c.from]) outgoing[c.from].push(c.to);
      if(incoming[c.to] !== undefined) incoming[c.to]++;
    });
    var roots = pages.filter(function(p){ return incoming[p.id] === 0; });
    if(!roots.length && pages.length) roots = [pages[0]]; // every page has an incoming arrow (a cycle) — no true start, so just pick one
    var visited = {}, ordered = [];
    function bfs(startId){
      var queue = [startId];
      visited[startId] = true;
      while(queue.length){
        var id = queue.shift();
        if(byId[id]) ordered.push(byId[id]);
        (outgoing[id] || []).forEach(function(toId){
          if(!visited[toId]){ visited[toId] = true; queue.push(toId); }
        });
      }
    }
    roots.forEach(function(r){ if(!visited[r.id]) bfs(r.id); });
    pages.forEach(function(p){ if(!visited[p.id]) ordered.push(p); });
    return ordered;
  }

  /* Imports (or re-imports) one quest into the store, keyed by a stable id
     derived from its filename — per the QuestLines convention, the quest id
     always matches the filename. A re-import matches pages by pageId to
     preserve any manual repositioning: surviving pages keep their x/y,
     brand-new pages get laid out below the rest, and pages no longer present
     in the source are soft-deleted to trash (recoverable), never dropped. */
  function importOrUpdateQuest(questId, questName, built, questlineId){
    var store = loadStore();
    var existing = store.quests[questId];
    var pages = built.pages;
    var trash;
    if(existing){
      var oldByPageId = {};
      (existing.pages || []).forEach(function(p){ oldByPageId[p.pageId] = p; });
      var toLayout = [], maxY = 0;
      pages.forEach(function(p){
        var old = oldByPageId[p.pageId];
        if(old){ p.x = old.x; p.y = old.y; if(p.y > maxY) maxY = p.y; }
        else { toLayout.push(p); }
      });
      if(toLayout.length){
        layoutPages(toLayout);
        toLayout.forEach(function(p){ p.y += maxY + 340; });
      }
      var stillPresent = {};
      pages.forEach(function(p){ stillPresent[p.pageId] = true; });
      trash = (existing.trash || []).slice();
      (existing.pages || []).forEach(function(p){
        if(!stillPresent[p.pageId]) trash.push({page: p, deletedAt: Date.now()});
      });
    } else {
      layoutPages(pages);
      trash = [];
    }
    store.quests[questId] = {
      id: questId,
      name: questName,
      questlineId: questlineId || null,
      status: existing && existing.status,
      pages: pages,
      connections: built.connections,
      trash: trash,
      pan: (existing && existing.pan) || {x: 60, y: 40},
      zoom: (existing && existing.zoom) || 1,
      updatedAt: Date.now()
    };
    store.nextPageId = state.nextPageId;
    store.nextConnId = state.nextConnId;
    // Throw rather than swallow: the questline folder importer wraps each
    // member's import in its own try/catch specifically so one failed save
    // (e.g. storage full) is reported and skipped instead of silently
    // leaving that quest missing with no explanation.
    if(!saveStore(store)) throw new Error('could not save to this browser (storage may be full)');
    return store;
  }

  function loadFromMarkdown(md, meta){
    var tables = parseMarkdownTables(md);
    var pages = tablesToPages(tables);
    layoutPages(pages);
    // tablesToPages() already assigned each page.id from the global
    // counter (state.nextPageId) — that counter persists across quest
    // switches now, so ids stay unique store-wide; never reset it here.
    state.pages = pages;
    state.connections = sequentialConnections(pages);
    state.trash = (meta && meta.trash) || [];
    state.selectedConn = null;
    state.selectedCardIds.clear();
    state.pan = {x: 60, y: 40};
    state.zoom = 1;
    state.questId = (meta && meta.questId) || genId();
    state.questName = (meta && meta.questName) || 'Untitled Quest';
    state.questlineId = (meta && meta.questlineId) || null;
    state.activeQuestlineId = null;
    state.questlineMembers = [];
    updateQuestPill();
    applyTransform();
    renderAll();
  }

  function restoreQuest(quest){
    state.pages = quest.pages || [];
    state.connections = quest.connections || [];
    state.trash = quest.trash || [];
    // nextPageId/nextConnId are NOT read from the quest record — they are a
    // global counter (state.nextPageId/nextConnId) set once at boot/switch
    // time from the store and never reset per-quest, so ids stay unique
    // even when several quests' pages are shown together in a questline view.
    // Pan/zoom are recomputed to frame the actual pages every time, rather
    // than trusting the quest's remembered camera position (see
    // fitViewToPages — a remembered position can point at empty space).
    fitViewToPages(state.pages);
    state.questId = quest.id;
    state.questName = quest.name || 'Untitled Quest';
    state.questlineId = quest.questlineId || null;
    state.activeQuestlineId = null;
    state.questlineMembers = [];
    state.selectedConn = null;
    state.selectedCardIds.clear();
    updateQuestPill();
    applyTransform();
    renderAll();
  }

  /* Lays out a whole questline's member quests as separate blocks. Section
     box geometry itself is NOT computed here — it's derived from the live
     DOM in renderSections() so it always tightly wraps the actual
     (dynamically sized) cards. */
  /* Stacks each member quest's pages into its own block on the shared
     questline canvas — WITHOUT touching their layout relative to each
     other. This used to call layoutPages() on every member unconditionally,
     which regenerated a fresh grid from scratch every single time the
     questline view opened, silently discarding any hand-arranged layout the
     pages already had (from a prior edit, or even just from import). Now it
     only ever translates each quest's existing block as a whole — layout
     itself is decided once, at import or by hand, and preserved from then
     on; this function's only job is keeping quests from overlapping.

     savedOffsets (questId -> {x, y}) is where a section was last dragged
     to, restored via persistCurrentQuestline()/switchToQuestline() below —
     without it, every reopen of a questline used to fall back to this
     function's own default vertical stack, silently discarding any manual
     rearrangement. A member with no saved offset yet (brand new to the
     questline, or from data saved before this existed) still gets that
     default stacked position, placed below the lowest point reached so far
     so it doesn't land on top of an already-positioned section. */
  function layoutQuestlineSections(members, savedOffsets){
    savedOffsets = savedOffsets || {};
    var y = 40;
    var PAD = 50, LABEL_H = 40, CARD_H_EST = 260, SECTION_GAP = 110;
    members.forEach(function(m){
      var pages = state.pages.filter(function(p){ return p._questId === m.questId; });
      if(!pages.length) return;
      var minX = Infinity, minY = Infinity, maxY = -Infinity;
      pages.forEach(function(p){
        if(p.x < minX) minX = p.x;
        if(p.y < minY) minY = p.y;
        if(p.y > maxY) maxY = p.y;
      });
      var saved = savedOffsets[m.questId];
      var targetX = saved ? saved.x : PAD;
      var targetY = saved ? saved.y : (y + LABEL_H);
      var shiftX = targetX - minX;
      var shiftY = targetY - minY;
      pages.forEach(function(p){
        p.x += shiftX;
        p.y += shiftY;
      });
      if(!saved) y = (y + LABEL_H) + (maxY - minY) + CARD_H_EST + SECTION_GAP;
    });
  }

  /* Opens a single quest by id (unchanged single-quest behavior). Flushes
     whatever is currently on the canvas first so a rename made just before
     switching isn't lost. */
  function switchToQuest(id){
    closeConnLabelChooser();
    if(state.questId || state.activeQuestlineId) persistCurrent();
    var store = loadStore();
    var quest = store.quests[id];
    if(!quest) return;
    state.nextPageId = store.nextPageId;
    state.nextConnId = store.nextConnId;
    // Show the canvas before restoring, not after — restoreQuest's
    // fitViewToPages needs the viewport's real on-screen size, which reads
    // as 0 while it's still display:none.
    showCanvasView();
    restoreQuest(quest);
    store.activeQuestId = id;
    store.activeQuestlineId = null;
    saveStore(store);
  }

  /* Opens an entire questline: merges every member quest's pages,
     connections, and trash into one canvas, tagging each entry with its
     source quest (_questId) so it can be split back apart on save, and
     lays out each quest's pages as a distinct block for section rendering. */
  /* Returns true on success. Can fail if the questline was deleted from
     under it, or (e.g. after reassigning its only quest elsewhere) it no
     longer has any member quests — callers must handle a false return
     rather than assume the canvas switched, since leaving state untouched
     is safer than showing a blank canvas for a questline with nothing in it. */
  function switchToQuestline(qlId){
    closeConnLabelChooser();
    if(state.questId || state.activeQuestlineId) persistCurrent();
    var store = loadStore();
    var ql = store.questlines[qlId];
    if(!ql) return false;
    var memberIds = Object.keys(store.quests).filter(function(qid){
      return store.quests[qid].questlineId === qlId;
    });
    if(!memberIds.length) return false;
    state.nextPageId = store.nextPageId;
    state.nextConnId = store.nextConnId;

    var pages = [], connections = [], trash = [], members = [];
    memberIds.forEach(function(qid){
      var q = store.quests[qid];
      members.push({questId: qid, name: q.name || 'Untitled Quest'});
      (q.pages || []).forEach(function(p){ p._questId = qid; pages.push(p); });
      (q.connections || []).forEach(function(c){ connections.push(c); });
      (q.trash || []).forEach(function(t){ t._questId = qid; trash.push(t); });
    });
    // Cross-quest connections are questline-level data, kept separate from
    // any single quest's own connections — tag them so rendering can style
    // them distinctly and persistCurrentQuestline() knows to route them back
    // to the questline record (not any one member quest) on save.
    (ql.connections || []).forEach(function(c){ c._cross = true; connections.push(c); });

    state.pages = pages;
    state.connections = connections;
    state.trash = trash;
    state.questlineMembers = members;
    state.selectedConn = null;
    state.selectedCardIds.clear();
    state.questId = null;
    state.questName = null;
    state.questlineId = null;
    state.activeQuestlineId = qlId;

    // Show the canvas before framing it — fitViewToPages needs the
    // viewport's real on-screen size, which reads as 0 while it's still
    // display:none (same reasoning as switchToQuest).
    showCanvasView();
    layoutQuestlineSections(members, ql.sectionPositions);
    fitViewToPages(pages);

    updateQuestPill();
    applyTransform();
    renderAll();

    store.activeQuestId = null;
    store.activeQuestlineId = qlId;
    saveStore(store);
    return true;
  }

  /* ================= rendering ================= */
  function fieldHtml(field){
    var keyLower = field.key.toLowerCase();
    if(keyLower === 'dialog'){
      return '<div class="field-block"><div class="field-label">Dialog</div>' +
        '<div class="field-prose">' + formatInline(field.value) + '</div></div>';
    }
    if(keyLower === 'response(s)' || keyLower === 'responses'){
      return '<div class="field-block"><div class="field-label">Response(s)</div>' +
        renderBulletField(field.value, 'response') + '</div>';
    }
    if(keyLower === 'journaltext'){
      return '<div class="field-block"><div class="field-label">Journal</div>' +
        '<div class="journal">' + formatInline(field.value) + '</div></div>';
    }
    if(keyLower === 'note(s)' || keyLower === 'notes'){
      return '<div class="field-block"><div class="field-label">Note(s)</div>' +
        renderBulletField(field.value, 'note') + '</div>';
    }
    if(keyLower === 'requirements'){
      return '<div class="field-block"><div class="field-label">Requirements</div>' +
        renderSimpleList(splitLines(field.value), 'note') + '</div>';
    }
    if(keyLower === 'objectives'){
      return '<div class="field-block"><div class="field-label">Objectives</div>' +
        renderSimpleList(splitLines(field.value), 'note') + '</div>';
    }
    if(keyLower === 'loadactions'){
      return '<div class="field-block"><div class="field-label">Load Actions</div>' +
        renderSimpleList(splitLines(field.value), 'note') + '</div>';
    }
    if(keyLower === 'location'){
      return '<div class="field-block kv-row"><span class="k">Location:</span><span class="v">' + formatInline(field.value) + '</span></div>';
    }
    if(looksLikeBulletField(field.value)){
      return '<div class="field-block"><div class="field-label">' + escapeHtml(field.key) + '</div>' +
        renderBulletField(field.value, 'note') + '</div>';
    }
    return '<div class="field-block"><div class="field-label">' + escapeHtml(field.key) + '</div>' +
      '<div class="field-prose">' + formatInline(field.value) + '</div></div>';
  }

  function buildCardEl(page){
    var el = document.createElement('div');
    el.className = 'card' + (state.selectedCardIds.has(page.id) ? ' selected' : '');
    el.dataset.id = page.id;
    el.style.left = page.x + 'px';
    el.style.top = page.y + 'px';

    var primary = page.fields.filter(function(f){return PRIMARY_KEYS.indexOf(f.key.toLowerCase()) > -1;});
    var extra = page.fields.filter(function(f){return PRIMARY_KEYS.indexOf(f.key.toLowerCase()) === -1;});

    var html = '';
    html += '<div class="card-header">';
    html += '  <div class="card-titles">';
    html += '    <div class="card-name">' + formatCardTitle(page.title) + '</div>';
    html += '    <div class="card-pageid">' + escapeHtml(page.pageId) + '</div>';
    html += '  </div>';
    html += '  <div class="handle handle-top" data-side="top" tabindex="0" title="Drag to connect"></div>';
    html += '  <div class="handle handle-left" data-side="left" tabindex="0" title="Drag to connect"></div>';
    html += '  <div class="handle handle-right" data-side="right" tabindex="0" title="Drag to connect"></div>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '  <div class="card-actions">';
    html += '    <button class="icon-btn edit-btn" title="Edit page" aria-label="Edit page">&#9998;</button>';
    html += '  </div>';
    primary.forEach(function(f){ html += fieldHtml(f); });
    if(extra.length){
      html += '<button class="expand-toggle" type="button">More <span class="chev">&#9662;</span></button>';
      html += '<div class="card-extra" hidden>';
      extra.forEach(function(f){ html += fieldHtml(f); });
      html += '</div>';
    }
    html += '</div>';

    el.innerHTML = html;
    return el;
  }

  function renderAll(){
    elCardsLayer.innerHTML = '';
    state.pages.forEach(function(page){
      elCardsLayer.appendChild(buildCardEl(page));
    });
    renderWires();
    renderSections();
  }

  function cardEl(id){
    return elCardsLayer.querySelector('.card[data-id="' + id + '"]');
  }

  /* Visual-only section boxes for the whole-questline canvas view: one
     labeled, dashed rectangle per member quest, tightly wrapping that
     quest's cards. Recomputed from the live DOM on every render, so it
     stays accurate as cards move or resize — not draggable as a group
     (that's a later stage), purely a visual grouping aid for now. */
  function renderSections(){
    var elSections = document.getElementById('sections-layer');
    if(!elSections) return;
    elSections.innerHTML = '';
    if(!state.activeQuestlineId) return;
    var byQuest = {};
    state.pages.forEach(function(p){
      if(!p._questId) return;
      if(!byQuest[p._questId]) byQuest[p._questId] = [];
      byQuest[p._questId].push(p);
    });
    var PAD = 34, LABEL_H = 30;
    state.questlineMembers.forEach(function(m){
      var pages = byQuest[m.questId];
      if(!pages || !pages.length) return;
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      pages.forEach(function(p){
        var el = cardEl(p.id);
        var w = el ? el.offsetWidth : CARD_W;
        var h = el ? el.offsetHeight : 220;
        if(p.x < minX) minX = p.x;
        if(p.y < minY) minY = p.y;
        if(p.x + w > maxX) maxX = p.x + w;
        if(p.y + h > maxY) maxY = p.y + h;
      });
      var box = document.createElement('div');
      box.className = 'quest-section';
      box.dataset.questId = m.questId;
      box.style.left = (minX - PAD) + 'px';
      box.style.top = (minY - PAD - LABEL_H) + 'px';
      box.style.width = (maxX - minX + PAD * 2) + 'px';
      box.style.height = (maxY - minY + PAD * 2 + LABEL_H) + 'px';
      var label = document.createElement('div');
      label.className = 'quest-section-label';
      label.textContent = m.name;
      box.appendChild(label);
      elSections.appendChild(box);
    });
  }

  function pageById(id){
    return state.pages.filter(function(p){return p.id === id;})[0];
  }

  var CARD_W = 308;
  var BORDER_W = 1;

  /* Anchor points sit exactly on the header edges: top-center, left-center,
     right-center of the header (matching the .handle-* CSS placement), not
     the middle of the whole card. Header height is measured from the live
     DOM since long NPC names can wrap it taller. */
  function anchorPoint(page, side){
    var headerEl = cardEl(page.id) ? cardEl(page.id).querySelector('.card-header') : null;
    var headerH = headerEl ? headerEl.offsetHeight : 56;
    if(side === 'top'){
      return {x: page.x + CARD_W / 2, y: page.y + BORDER_W};
    }
    if(side === 'right'){
      return {x: page.x + CARD_W - BORDER_W, y: page.y + BORDER_W + headerH / 2};
    }
    return {x: page.x + BORDER_W, y: page.y + BORDER_W + headerH / 2};
  }

  /* Unit vector each side's control handle pulls toward, so the curve
     leaves/arrives perpendicular to the edge it's anchored on. */
  function controlDir(side){
    if(side === 'top') return {x: 0, y: -1};
    if(side === 'right') return {x: 1, y: 0};
    return {x: -1, y: 0};
  }

  function bezierParts(fromPage, fromSide, toPage, toSide){
    var p1 = anchorPoint(fromPage, fromSide);
    var p2 = anchorPoint(toPage, toSide);
    var dx = Math.max(55, Math.hypot(p2.x - p1.x, p2.y - p1.y) * 0.5);
    var d1 = controlDir(fromSide), d2 = controlDir(toSide);
    var c1 = {x: p1.x + d1.x * dx, y: p1.y + d1.y * dx};
    var c2 = {x: p2.x + d2.x * dx, y: p2.y + d2.y * dx};
    return {p1: p1, c1: c1, c2: c2, p2: p2};
  }

  function pathFor(fromPage, fromSide, toPage, toSide){
    var b = bezierParts(fromPage, fromSide, toPage, toSide);
    return 'M ' + b.p1.x + ' ' + b.p1.y +
      ' C ' + b.c1.x + ' ' + b.c1.y + ', ' + b.c2.x + ' ' + b.c2.y + ', ' + b.p2.x + ' ' + b.p2.y;
  }

  function bezierPointAt(b, t){
    var mt = 1 - t;
    return {
      x: mt*mt*mt*b.p1.x + 3*mt*mt*t*b.c1.x + 3*mt*t*t*b.c2.x + t*t*t*b.p2.x,
      y: mt*mt*mt*b.p1.y + 3*mt*mt*t*b.c1.y + 3*mt*t*t*b.c2.y + t*t*t*b.p2.y
    };
  }

  // When a page links to another page and that other page links straight
  // back, the second-added arrow of the pair is the "return" leg — flagged
  // here so renderWires can draw it grey instead of the standard pink. Pairs
  // are matched by array order rather than creation timestamp (connections
  // carry none), which in practice is the same thing: the forward arrow gets
  // drawn first, the "go back" arrow gets added after it.
  function computeMutualReturnIds(connections){
    var returnIds = {};
    connections.forEach(function(a, i){
      if(returnIds[a.id]) return;
      for(var j = i + 1; j < connections.length; j++){
        var b = connections[j];
        if(!returnIds[b.id] && b.from === a.to && b.to === a.from){
          returnIds[b.id] = true;
          break;
        }
      }
    });
    return returnIds;
  }

  function renderWires(){
    while(elWires.childNodes.length > 1){
      elWires.removeChild(elWires.lastChild);
    }
    var returnIds = computeMutualReturnIds(state.connections);
    state.connections.forEach(function(conn){
      var from = pageById(conn.from), to = pageById(conn.to);
      if(!from || !to) return;
      var d = pathFor(from, conn.fromSide, to, conn.toSide);

      var hit = document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.setAttribute('d', d);
      hit.setAttribute('class', 'wire-hit');
      hit.dataset.conn = conn.id;
      hit.style.pointerEvents = 'stroke';
      hit.addEventListener('click', function(e){
        e.stopPropagation();
        state.selectedConn = state.selectedConn === conn.id ? null : conn.id;
        renderWires();
      });
      // A same-quest arrow built from a response carries that response's
      // text; a cross-quest arrow carries the raw requirement string (e.g.
      // "questCompleted:welcome_herald") that produced it. Either way, the
      // full text still shows here as a hover tooltip even after the
      // on-canvas label below has truncated it.
      if(conn.label){
        var titleEl = document.createElementNS('http://www.w3.org/2000/svg','title');
        titleEl.textContent = conn.label;
        hit.appendChild(titleEl);
      }
      elWires.appendChild(hit);

      var visible = document.createElementNS('http://www.w3.org/2000/svg','path');
      visible.setAttribute('d', d);
      var isReturn = !!returnIds[conn.id];
      visible.setAttribute('class', 'wire' + (conn._cross ? ' wire-cross' : '') + (isReturn ? ' wire-return' : '') + (state.selectedConn === conn.id ? ' selected' : ''));
      visible.setAttribute('marker-end', isReturn ? 'url(#arrowhead-return)' : 'url(#arrowhead)');
      elWires.appendChild(visible);

      // Ride the response text (or, for auto-drawn cross-quest arrows, the
      // quest-state gate) along the wire itself — sits at t=0.35 so it never
      // collides with the delete control, which appears at the t=0.5 midpoint
      // only while the wire is selected. Skipped for a same-quest arrow when
      // its source page currently has only one response: with nothing to
      // disambiguate, the label is just clutter (checked live against the
      // page's current Response(s) field, not the label's own snapshot, so
      // trimming a page down to one response quietly stops labeling it too).
      var showWireLabel = conn.label && (conn._cross || responseChoicesForPage(from).length > 1);
      if(showWireLabel){
        var labelPt = bezierPointAt(bezierParts(from, conn.fromSide, to, conn.toSide), 0.35);
        var shortLabel = conn.label.length > 26 ? conn.label.slice(0, 25) + '…' : conn.label;
        var lg = document.createElementNS('http://www.w3.org/2000/svg','g');
        lg.setAttribute('class', 'wire-label' + (conn._cross ? ' cross' : ''));
        lg.setAttribute('transform', 'translate(' + labelPt.x + ',' + labelPt.y + ')');
        var lw = Math.max(20, shortLabel.length * 5.6 + 10);
        var lr = document.createElementNS('http://www.w3.org/2000/svg','rect');
        lr.setAttribute('x', -lw / 2);
        lr.setAttribute('y', -9);
        lr.setAttribute('width', lw);
        lr.setAttribute('height', 18);
        lr.setAttribute('rx', 4);
        var lt = document.createElementNS('http://www.w3.org/2000/svg','text');
        lt.textContent = shortLabel;
        lg.appendChild(lr);
        lg.appendChild(lt);
        elWires.appendChild(lg);
      }

      if(state.selectedConn === conn.id){
        var mid = bezierPointAt(bezierParts(from, conn.fromSide, to, conn.toSide), 0.5);
        var g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('class', 'wire-del');
        g.setAttribute('transform', 'translate(' + mid.x + ',' + mid.y + ')');
        var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('r', '10');
        var t = document.createElementNS('http://www.w3.org/2000/svg','text');
        t.textContent = '×';
        g.appendChild(c); g.appendChild(t);
        g.addEventListener('click', function(e){
          e.stopPropagation();
          removeConnection(conn.id);
        });
        elWires.appendChild(g);

        // Only worth offering when the source page actually has response
        // text to pick from — a page with none has nothing to label with.
        var labelChoices = responseChoicesForPage(from);
        if(labelChoices.length){
          var tg = document.createElementNS('http://www.w3.org/2000/svg','g');
          tg.setAttribute('class', 'wire-del wire-tag');
          tg.setAttribute('transform', 'translate(' + (mid.x - 26) + ',' + mid.y + ')');
          var tc = document.createElementNS('http://www.w3.org/2000/svg','circle');
          tc.setAttribute('r', '10');
          var tt = document.createElementNS('http://www.w3.org/2000/svg','text');
          tt.textContent = '✎';
          tg.appendChild(tc); tg.appendChild(tt);
          tg.addEventListener('click', function(e){
            e.stopPropagation();
            var pt = toClient(mid.x - 26, mid.y + 20);
            showConnLabelChooser(conn, labelChoices, pt.x, pt.y);
          });
          elWires.appendChild(tg);
        }
      }
    });
    scheduleAutosave();
  }

  function removeConnection(id){
    state.connections = state.connections.filter(function(c){return c.id !== id;});
    state.selectedConn = null;
    renderWires();
  }

  /* A small floating chooser, positioned over the canvas at a screen point,
     offering a wire's source-page responses as its label. Used both right
     after hand-drawing a new connection (when the source page has more than
     one response, so which one this arrow represents isn't obvious) and from
     the tag button on an already-selected wire (to set or change it later). */
  function closeConnLabelChooser(){
    var existing = document.getElementById('conn-label-chooser');
    if(existing) existing.remove();
  }

  function showConnLabelChooser(conn, choices, clientX, clientY){
    closeConnLabelChooser();
    var box = document.createElement('div');
    box.id = 'conn-label-chooser';
    box.className = 'conn-label-chooser';
    box.style.left = clientX + 'px';
    box.style.top = clientY + 'px';

    var head = document.createElement('div');
    head.className = 'clc-head';
    head.textContent = 'Which response leads here?';
    box.appendChild(head);

    choices.forEach(function(text){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = text;
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        conn.label = text;
        closeConnLabelChooser();
        renderWires();
      });
      box.appendChild(btn);
    });

    if(conn.label){
      var clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'clc-skip';
      clear.textContent = 'Clear label';
      clear.addEventListener('click', function(e){
        e.stopPropagation();
        delete conn.label;
        closeConnLabelChooser();
        renderWires();
      });
      box.appendChild(clear);
    } else {
      var skip = document.createElement('button');
      skip.type = 'button';
      skip.className = 'clc-skip';
      skip.textContent = 'No label';
      skip.addEventListener('click', function(e){
        e.stopPropagation();
        closeConnLabelChooser();
      });
      box.appendChild(skip);
    }

    document.body.appendChild(box);
    // clamp on-screen after layout, so it doesn't spill past the right/bottom edge
    var r = box.getBoundingClientRect();
    if(r.right > window.innerWidth) box.style.left = Math.max(4, window.innerWidth - r.width - 8) + 'px';
    if(r.bottom > window.innerHeight) box.style.top = Math.max(4, window.innerHeight - r.height - 8) + 'px';

    setTimeout(function(){
      document.addEventListener('mousedown', function dismiss(e){
        if(box.contains(e.target)) return;
        closeConnLabelChooser();
        document.removeEventListener('mousedown', dismiss);
      });
    }, 0);
  }

  /* Soft delete: the page moves to state.trash instead of being discarded,
     so a deletion is always recoverable. Its connections are dropped (a
     restored page comes back unattached, on purpose — reattaching after
     other things may have changed is the user's call, not ours to guess). */
  function removePage(id){
    var page = pageById(id);
    if(!page) return;
    state.pages = state.pages.filter(function(p){return p.id !== id;});
    state.connections = state.connections.filter(function(c){return c.from !== id && c.to !== id;});
    var entry = {page: page, deletedAt: Date.now()};
    // in a whole-questline view, carry the page's source-quest tag onto the
    // trash entry too, so persistCurrentQuestline() can still attribute it
    // back to the right quest when splitting the merged state on save
    if(page._questId) entry._questId = page._questId;
