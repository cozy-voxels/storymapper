    state.trash.push(entry);
    state.selectedCardIds.delete(id);
    renderAll();
  }

  function restorePage(trashIndex){
    var entry = state.trash[trashIndex];
    if(!entry) return;
    var wp = toWorld(elViewport.getBoundingClientRect().left + elViewport.clientWidth/2,
                      elViewport.getBoundingClientRect().top + elViewport.clientHeight/2);
    entry.page.x = wp.x - 150;
    entry.page.y = wp.y - 80;
    state.pages.push(entry.page);
    state.trash.splice(trashIndex, 1);
    renderAll();
    renderTrashList();
  }

  /* ================= pan & zoom ================= */
  function applyTransform(){
    elWorld.style.transform = 'translate(' + state.pan.x + 'px,' + state.pan.y + 'px) scale(' + state.zoom + ')';
    elZoomPct.textContent = Math.round(state.zoom * 100) + '%';
    scheduleAutosave();
  }

  function toWorld(clientX, clientY){
    var rect = elViewport.getBoundingClientRect();
    return {
      x: (clientX - rect.left - state.pan.x) / state.zoom,
      y: (clientY - rect.top - state.pan.y) / state.zoom
    };
  }

  /* Inverse of toWorld — used to place the HTML response-label chooser over
     a world-space point (a wire's midpoint) rather than a raw mouse event. */
  function toClient(worldX, worldY){
    var rect = elViewport.getBoundingClientRect();
    return {
      x: rect.left + state.pan.x + worldX * state.zoom,
      y: rect.top + state.pan.y + worldY * state.zoom
    };
  }

  function setZoom(newZoom, aroundClientX, aroundClientY){
    // Floor is 5% rather than something closer to 35-50% specifically so a
    // very large board can be zoomed out far enough to spot a stray card or
    // section that's drifted way off from the rest.
    newZoom = Math.max(0.05, Math.min(2, newZoom));
    if(aroundClientX !== undefined){
      var before = toWorld(aroundClientX, aroundClientY);
      state.zoom = newZoom;
      var rect = elViewport.getBoundingClientRect();
      state.pan.x = (aroundClientX - rect.left) - before.x * state.zoom;
      state.pan.y = (aroundClientY - rect.top) - before.y * state.zoom;
    } else {
      state.zoom = newZoom;
    }
    applyTransform();
  }

  document.getElementById('zoom-in').addEventListener('click', function(){
    var r = elViewport.getBoundingClientRect();
    setZoom(state.zoom * 1.18, r.left + r.width/2, r.top + r.height/2);
  });
  document.getElementById('zoom-out').addEventListener('click', function(){
    var r = elViewport.getBoundingClientRect();
    setZoom(state.zoom / 1.18, r.left + r.width/2, r.top + r.height/2);
  });
  elZoomPct.addEventListener('click', function(){
    var r = elViewport.getBoundingClientRect();
    setZoom(1, r.left + r.width/2, r.top + r.height/2);
  });

  elViewport.addEventListener('wheel', function(e){
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.08 : 1/1.08;
    setZoom(state.zoom * factor, e.clientX, e.clientY);
  }, {passive:false});

  /* ---- panning on empty canvas ---- */
  var panDrag = null;
  elViewport.addEventListener('mousedown', function(e){
    // .wire-del covers both the x delete button and the pencil edit button
    // on a selected wire. Without this exclusion, a mousedown on either one
    // bubbled up here first (before the button's own 'click' handler could
    // fire), deselected the connection, and re-rendered the wires layer —
    // which deletes the button element itself. The click event then had
    // nothing left to fire on, so the buttons looked dead despite being
    // visible and having working click listeners.
    if(e.target.closest('.card') || e.target.closest('.handle') || e.target.closest('#zoom-ctl') || e.target.closest('.quest-section') || e.target.closest('.wire-del')) return;
    // Shift-drag on empty canvas: draw a lasso instead of panning, to select
    // several cards for a temporary group move (see startMarquee below).
    if(e.shiftKey){
      startMarquee(e.clientX, e.clientY);
      return;
    }
    panDrag = {startX: e.clientX, startY: e.clientY, panX: state.pan.x, panY: state.pan.y};
    elViewport.classList.add('panning');
    if(state.selectedConn){ state.selectedConn = null; renderWires(); }
    // A plain click on empty canvas drops the temp group too, same as
    // clicking away from anything else selected on the canvas.
    if(state.selectedCardIds.size){ state.selectedCardIds.clear(); renderAll(); }
  });

  /* ---- lasso (shift-drag) multi-select: a temporary "group" for moving
     several cards at once. Unlike a Questline, this selection is pure UI
     state — never written to the store, and cleared on every quest switch,
     Escape, or a plain click on empty canvas. ---- */
  var elMarqueeBox = document.getElementById('marquee-box');
  var marqueeDrag = null;
  function startMarquee(clientX, clientY){
    marqueeDrag = {startX: clientX, startY: clientY};
    elMarqueeBox.style.left = clientX + 'px';
    elMarqueeBox.style.top = clientY + 'px';
    elMarqueeBox.style.width = '0px';
    elMarqueeBox.style.height = '0px';
    elMarqueeBox.style.display = 'block';
  }
  function updateMarquee(clientX, clientY){
    if(!marqueeDrag) return;
    var x0 = Math.min(marqueeDrag.startX, clientX), x1 = Math.max(marqueeDrag.startX, clientX);
    var y0 = Math.min(marqueeDrag.startY, clientY), y1 = Math.max(marqueeDrag.startY, clientY);
    elMarqueeBox.style.left = x0 + 'px';
    elMarqueeBox.style.top = y0 + 'px';
    elMarqueeBox.style.width = (x1 - x0) + 'px';
    elMarqueeBox.style.height = (y1 - y0) + 'px';
  }
  // Estimated card height, same reasoning as fitViewToPages: actual height
  // is content-dependent and only known post-render, so this is approximate
  // — good enough for "does the lasso overlap this card", not pixel-perfect.
  var CARD_H_EST_SELECT = 220;
  function finishMarquee(clientX, clientY){
    var a = toWorld(marqueeDrag.startX, marqueeDrag.startY);
    var b = toWorld(clientX, clientY);
    var minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
    var minY = Math.min(a.y, b.y), maxY = Math.max(a.y, b.y);
    var picked = state.pages.filter(function(p){
      var el = cardEl(p.id);
      var h = el ? el.offsetHeight : CARD_H_EST_SELECT;
      return p.x < maxX && p.x + CARD_W > minX && p.y < maxY && p.y + h > minY;
    });
    state.selectedCardIds = new Set(picked.map(function(p){ return p.id; }));
    marqueeDrag = null;
    elMarqueeBox.style.display = 'none';
    renderAll();
  }

  /* ---- section dragging (whole-questline view: drag a quest's section
     box to move every one of that quest's pages together, keeping their
     positions relative to each other — full container behavior, not just
     the label) ---- */
  var sectionDrag = null;
  document.getElementById('sections-layer').addEventListener('mousedown', function(e){
    var box = e.target.closest('.quest-section');
    if(!box) return;
    var qid = box.dataset.questId;
    var wp = toWorld(e.clientX, e.clientY);
    var pages = state.pages.filter(function(p){ return p._questId === qid; });
    sectionDrag = {
      questId: qid,
      startX: wp.x, startY: wp.y,
      pages: pages.map(function(p){ return {page: p, startX: p.x, startY: p.y}; })
    };
    box.classList.add('dragging');
    e.stopPropagation();
  });

  /* ---- card dragging ---- */
  var cardDrag = null;
  // Dragging a card that's part of an active lasso selection (2+ cards)
  // moves the whole temp group together, keeping their relative positions —
  // same idea as sectionDrag above, but for an ad-hoc selection rather than
  // a whole Questline's pages.
  var groupDrag = null;
  elCardsLayer.addEventListener('mousedown', function(e){
    var handle = e.target.closest('.handle');
    if(handle){
      var cardElRef = handle.closest('.card');
      startConnecting(cardElRef.dataset.id, handle.dataset.side);
      e.stopPropagation();
      return;
    }
    var header = e.target.closest('.card-header');
    if(header && !e.target.closest('.icon-btn')){
      var cEl = header.closest('.card');
      var page = pageById(cEl.dataset.id);
      var wp = toWorld(e.clientX, e.clientY);
      if(state.selectedCardIds.size > 1 && state.selectedCardIds.has(page.id)){
        groupDrag = {
          startX: wp.x, startY: wp.y,
          pages: Array.from(state.selectedCardIds).map(pageById).filter(Boolean)
            .map(function(p){ return {page: p, startX: p.x, startY: p.y}; })
        };
        groupDrag.pages.forEach(function(entry){
          var gEl = cardEl(entry.page.id);
          if(gEl) gEl.classList.add('dragging');
        });
        e.stopPropagation();
        return;
      }
      cardDrag = {id: page.id, offX: wp.x - page.x, offY: wp.y - page.y};
      cEl.classList.add('dragging');
      e.stopPropagation();
    }
  });

  /* ---- connection dragging ---- */
  var connecting = null;
  var elTempWire = null;
  function startConnecting(cardId, side){
    connecting = {fromId: cardId, fromSide: side};
    elTempWire = document.createElementNS('http://www.w3.org/2000/svg','path');
    elTempWire.setAttribute('class', 'wire-temp');
    elWires.appendChild(elTempWire);
    elViewport.classList.add('connecting');
  }

  function stopConnecting(){
    if(elTempWire && elTempWire.parentNode) elTempWire.parentNode.removeChild(elTempWire);
    connecting = null;
    elTempWire = null;
    elViewport.classList.remove('connecting');
  }

  /* While dragging, the wire always leaves from the exact handle the user
     grabbed (fromSide is fixed at drag-start, never re-guessed). */
  function updateTempWire(clientX, clientY){
    if(!connecting) return;
    var from = pageById(connecting.fromId);
    var wp = toWorld(clientX, clientY);
    var p1 = anchorPoint(from, connecting.fromSide);
    var dir = controlDir(connecting.fromSide);
    var dx = Math.max(55, Math.hypot(wp.x - p1.x, wp.y - p1.y) * 0.5);
    var c1 = {x: p1.x + dir.x * dx, y: p1.y + dir.y * dx};
    var c2 = {x: (c1.x + wp.x) / 2, y: (c1.y + wp.y) / 2};
    var d = 'M ' + p1.x + ' ' + p1.y + ' C ' + c1.x + ' ' + c1.y + ', ' + c2.x + ' ' + c2.y + ', ' + wp.x + ' ' + wp.y;
    elTempWire.setAttribute('d', d);
  }

  /* When the drop isn't precisely on a handle (its hit area is small, and a
     neighboring card placed close by can sit on top of it), fall back to
     whichever side's anchor point — top, left, or right — the drop is
     actually nearest to, rather than only ever guessing left/right by which
     horizontal half of the card it landed in. That old left/right-only
     guess meant a drop aimed at the top handle but landed a few pixels off
     would silently connect to a side instead, with no feedback that
     anything other than "top" had happened. */
  function nearestSide(page, worldX, worldY){
    var top = anchorPoint(page, 'top');
    var left = anchorPoint(page, 'left');
    var right = anchorPoint(page, 'right');
    var dTop = Math.hypot(worldX - top.x, worldY - top.y);
    var dLeft = Math.hypot(worldX - left.x, worldY - left.y);
    var dRight = Math.hypot(worldX - right.x, worldY - right.y);
    if(dTop <= dLeft && dTop <= dRight) return 'top';
    return dLeft <= dRight ? 'left' : 'right';
  }

  document.addEventListener('mousemove', function(e){
    if(marqueeDrag){
      updateMarquee(e.clientX, e.clientY);
      return;
    }
    if(groupDrag){
      var gwp = toWorld(e.clientX, e.clientY);
      var gdx = gwp.x - groupDrag.startX;
      var gdy = gwp.y - groupDrag.startY;
      groupDrag.pages.forEach(function(entry){
        entry.page.x = entry.startX + gdx;
        entry.page.y = entry.startY + gdy;
        var gEl = cardEl(entry.page.id);
        if(gEl){ gEl.style.left = entry.page.x + 'px'; gEl.style.top = entry.page.y + 'px'; }
      });
      renderWires();
      if(state.activeQuestlineId) renderSections();
      return;
    }
    if(panDrag){
      state.pan.x = panDrag.panX + (e.clientX - panDrag.startX);
      state.pan.y = panDrag.panY + (e.clientY - panDrag.startY);
      applyTransform();
      return;
    }
    if(cardDrag){
      var page = pageById(cardDrag.id);
      var wp = toWorld(e.clientX, e.clientY);
      // No lower bound: a card can be dragged to any x/y, including
      // negative — clamping to 0 here used to make the canvas origin feel
      // like a wall nothing could be pushed past.
      page.x = wp.x - cardDrag.offX;
      page.y = wp.y - cardDrag.offY;
      var el = cardEl(page.id);
      el.style.left = page.x + 'px';
      el.style.top = page.y + 'px';
      renderWires();
      // keep a page's section box tightly wrapped even when it's dragged
      // on its own (not as part of a whole-section drag)
      if(state.activeQuestlineId) renderSections();
      return;
    }
    if(sectionDrag){
      var swp = toWorld(e.clientX, e.clientY);
      var dx = swp.x - sectionDrag.startX;
      var dy = swp.y - sectionDrag.startY;
      sectionDrag.pages.forEach(function(entry){
        entry.page.x = entry.startX + dx;
        entry.page.y = entry.startY + dy;
        var cEl = cardEl(entry.page.id);
        if(cEl){ cEl.style.left = entry.page.x + 'px'; cEl.style.top = entry.page.y + 'px'; }
      });
      renderWires();
      renderSections();
      // renderSections() rebuilds the boxes from scratch, so re-apply the
      // "actively dragging" cursor state to the one the user is holding
      var draggingBox = document.querySelector('.quest-section[data-quest-id="' + sectionDrag.questId + '"]');
      if(draggingBox) draggingBox.classList.add('dragging');
      return;
    }
    if(connecting){
      updateTempWire(e.clientX, e.clientY);
    }
  });

  document.addEventListener('mouseup', function(e){
    if(marqueeDrag){
      finishMarquee(e.clientX, e.clientY);
    }
    if(groupDrag){
      groupDrag.pages.forEach(function(entry){
        var gEl = cardEl(entry.page.id);
        if(gEl) gEl.classList.remove('dragging');
      });
      groupDrag = null;
    }
    if(panDrag){
      panDrag = null;
      elViewport.classList.remove('panning');
    }
    if(cardDrag){
      var el = cardEl(cardDrag.id);
      if(el) el.classList.remove('dragging');
      cardDrag = null;
    }
    if(sectionDrag){
      var box = document.querySelector('.quest-section[data-quest-id="' + sectionDrag.questId + '"]');
      if(box) box.classList.remove('dragging');
      sectionDrag = null;
    }
    if(connecting){
      // e.target alone is whatever the browser's normal hit-test resolves
      // to — which, when two cards are placed close together (exactly the
      // arrangement someone reaches for when they want a tight top-to-top
      // connection), is very often the card being dragged FROM: it and the
      // target can end up overlapping by a few pixels, and since both share
      // the same z-index, DOM order decides the winner regardless of which
      // one actually makes sense here. elementsFromPoint returns the whole
      // stack at that point, so this can skip straight past the source card
      // (and past anything else in the way) to the target underneath,
      // rather than the drop silently doing nothing because the wrong card
      // happened to be on top.
      var hitStack = document.elementsFromPoint ? document.elementsFromPoint(e.clientX, e.clientY) : [e.target];
      var handleTarget = null, targetCardEl = null;
      for(var hi = 0; hi < hitStack.length; hi++){
        var hEl = hitStack[hi].closest && hitStack[hi].closest('.handle');
        if(hEl){
          var hCard = hEl.closest('.card');
          if(hCard && hCard.dataset.id !== connecting.fromId){ handleTarget = hEl; targetCardEl = hCard; break; }
        }
      }
      if(!targetCardEl){
        for(var ci = 0; ci < hitStack.length; ci++){
          var cEl = hitStack[ci].closest && hitStack[ci].closest('.card');
          if(cEl && cEl.dataset.id !== connecting.fromId){ targetCardEl = cEl; break; }
        }
      }
      if(targetCardEl){
        var toId = targetCardEl.dataset.id;
        var toPage = pageById(toId);
        var fromPage = pageById(connecting.fromId);
        var dropWp = toWorld(e.clientX, e.clientY);
        var toSide = handleTarget ? handleTarget.dataset.side : nearestSide(toPage, dropWp.x, dropWp.y);
        // Directed, not undirected: a submenu page that leads back to the
        // page that opened it (very common — "Got it." returning to a menu)
        // is two separate, legitimate arrows, one each way. This used to
        // treat A->B and B->A as the same connection, so once one direction
        // existed, drawing the other direction silently did nothing — no
        // error, the drag just ended with no new arrow, no matter which
        // side you dropped on, since it never got far enough to look at
        // sides at all. Only reject an exact repeat of the same direction.
        var exists = state.connections.some(function(c){
          return c.from === connecting.fromId && c.to === toId;
        });
        // A connection between pages tagged with different source quests
        // (only possible in a whole-questline view) is questline-level data,
        // not part of either quest's own dialog flow — flag it as such.
        var isCross = !!(fromPage._questId && toPage._questId && fromPage._questId !== toPage._questId);
        if(!exists){
          var newConn = {
            id: 'w' + (state.nextConnId++),
            from: connecting.fromId, to: toId,
            fromSide: connecting.fromSide, toSide: toSide
          };
          if(isCross) newConn._cross = true;
          state.connections.push(newConn);
          // Cross-quest arrows get their label from a quest-state gate on
          // import, not from response text, so this only applies same-quest.
          // One response: no real choice to make, so just use it. More than
          // one: ask, since which response this particular arrow represents
          // isn't otherwise obvious once several exit the same card.
          if(!isCross){
            var respChoices = responseChoicesForPage(fromPage);
            if(respChoices.length === 1){
              newConn.label = respChoices[0];
            } else if(respChoices.length > 1){
              showConnLabelChooser(newConn, respChoices, e.clientX, e.clientY);
            }
          }
        }
      }
      stopConnecting();
      renderWires();
    }
  });

  document.addEventListener('keydown', function(e){
    var tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if((e.key === 'Delete' || e.key === 'Backspace') && state.selectedConn){
      removeConnection(state.selectedConn);
    }
    if(e.key === 'Escape' && connecting){
      stopConnecting();
    }
    if(e.key === 'Escape'){
      closeConnLabelChooser();
    }
    if(e.key === 'Escape' && state.selectedCardIds.size){
      state.selectedCardIds.clear();
      renderAll();
    }
  });

  /* ---- card action buttons (edit / delete / expand) ---- */
  elCardsLayer.addEventListener('click', function(e){
    var editBtn = e.target.closest('.edit-btn');
    if(editBtn){
      openEditor(editBtn.closest('.card').dataset.id);
      return;
    }
    var toggle = e.target.closest('.expand-toggle');
    if(toggle){
      var extra = toggle.parentNode.querySelector('.card-extra');
      var isHidden = extra.hasAttribute('hidden');
      if(isHidden){ extra.removeAttribute('hidden'); toggle.innerHTML = 'Less <span class="chev">&#9652;</span>'; }
      else { extra.setAttribute('hidden',''); toggle.innerHTML = 'More <span class="chev">&#9662;</span>'; }
    }
  });

  /* ================= edit modal ================= */
  var elModalBackdrop = document.getElementById('modal-backdrop');
  var elModalName = document.getElementById('modal-name');
  var elModalPageId = document.getElementById('modal-pageid');
  var elModalFieldsList = document.getElementById('modal-fields-list');

  /* These six always get their own fixed row in the editor, matching the
     PageData model fields (see ql_data-models.md). Everything else on a
     page stays freeform under "Other Fields". */
  var FIXED_FIELD_DEFS = [
    {match: ['dialog'], canonical: 'Dialog', el: 'modal-dialog'},
    {match: ['journaltext'], canonical: 'JournalText', el: 'modal-journaltext'},
    {match: ['response(s)', 'responses'], canonical: 'Response(s)', el: 'modal-responses'},
    {match: ['requirements'], canonical: 'Requirements', el: 'modal-requirements'},
    {match: ['objectives'], canonical: 'Objectives', el: 'modal-objectives'},
    {match: ['loadactions'], canonical: 'LoadActions', el: 'modal-loadactions'}
  ];

  function isFixedKey(key){
    var lower = key.toLowerCase();
    return FIXED_FIELD_DEFS.some(function(def){ return def.match.indexOf(lower) > -1; });
  }

  function fieldRow(key, value){
    var row = document.createElement('div');
    row.className = 'field-row';
    row.innerHTML = '<input class="key" type="text" value="' + escapeHtml(key) + '">' +
      '<textarea class="val" rows="2"></textarea>' +
      '<button type="button" title="Remove field" aria-label="Remove field">&times;</button>';
    row.querySelector('.val').value = value;
    row.querySelector('button').addEventListener('click', function(){ row.remove(); });
    return row;
  }

  function openEditor(cardId){
    var page = pageById(cardId);
    if(!page) return;
    state.editingCardId = cardId;
    elModalName.value = page.title;
    elModalPageId.value = page.pageId;

    FIXED_FIELD_DEFS.forEach(function(def){
      var found = page.fields.filter(function(f){
        return def.match.indexOf(f.key.toLowerCase()) > -1;
      })[0];
      document.getElementById(def.el).value = found ? found.value : '';
    });

    elModalFieldsList.innerHTML = '';
    page.fields.forEach(function(f){
      if(isFixedKey(f.key)) return;
      elModalFieldsList.appendChild(fieldRow(f.key, f.value));
    });
    document.getElementById('modal-title').textContent = 'Edit page';
    elModalBackdrop.classList.add('open');
    elModalName.focus();
  }

  function openNewCardEditor(){
    var wp = toWorld(elViewport.getBoundingClientRect().left + elViewport.clientWidth/2,
                      elViewport.getBoundingClientRect().top + elViewport.clientHeight/2);
    var page = {
      id: 'p' + (state.nextPageId++),
      title: 'New NPC',
      pageId: 'new_page_id',
      fields: [{key:'Dialog', value:''}, {key:'Response(s)', value:'- '}],
      x: wp.x - 150, y: wp.y - 80
    };
    state.pages.push(page);
    renderAll();
    openEditor(page.id);
  }

  document.getElementById('add-field-btn').addEventListener('click', function(){
    elModalFieldsList.appendChild(fieldRow('New Field', ''));
  });

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  elModalBackdrop.addEventListener('mousedown', function(e){
    if(e.target === elModalBackdrop) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && elModalBackdrop.classList.contains('open')) closeModal();
  });

  function closeModal(){
    elModalBackdrop.classList.remove('open');
    state.editingCardId = null;
  }

  document.getElementById('modal-save').addEventListener('click', function(){
    var page = pageById(state.editingCardId);
    if(!page) return;
    page.title = elModalName.value.trim() || 'Unnamed NPC';
    page.pageId = elModalPageId.value.trim() || '—';

    var fields = [];
    FIXED_FIELD_DEFS.forEach(function(def){
      var v = document.getElementById(def.el).value;
      if(v.trim()) fields.push({key: def.canonical, value: v});
    });
    elModalFieldsList.querySelectorAll('.field-row').forEach(function(row){
      var k = row.querySelector('.key').value.trim();
      var v = row.querySelector('.val').value;
      if(k) fields.push({key:k, value:v});
    });
    page.fields = fields;
    closeModal();
    renderAll();
  });

  document.getElementById('modal-delete').addEventListener('click', function(){
    var id = state.editingCardId;
    closeModal();
    if(id) removePage(id);
  });

  /* ================= trash panel ================= */
  var elTrashBackdrop = document.getElementById('trash-backdrop');
  var elTrashList = document.getElementById('trash-list');

  function timeAgo(ms){
    var diff = Math.max(0, Date.now() - ms);
    var mins = Math.round(diff / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    var hours = Math.round(mins / 60);
    if(hours < 24) return hours + 'h ago';
    var days = Math.round(hours / 24);
    return days + 'd ago';
  }

  /* Restore is one panel covering all three soft-deletable things — pages,
     quests, and questlines — kept as separate sections rather than a merged
     list since they restore through different code paths and a page's
     trash only ever means "in the quest currently open" while quests and
     questlines are store-wide. Each row carries data-type + data-index so
     the single click handler below can route to the right restore fn. */
  function renderTrashList(){
    var store = loadStore();
    var html = '';

    html += '<div class="trash-section"><h3 class="trash-section-head">Pages</h3>';
    if(!state.questId && !state.activeQuestlineId){
      html += '<div class="trash-empty">Open a quest or questline to see its deleted pages.</div>';
    } else if(!state.trash.length){
      html += '<div class="trash-empty">Nothing deleted in this quest.</div>';
    } else {
      state.trash.forEach(function(entry, i){
        html += '<div class="trash-row" data-type="page" data-index="' + i + '">' +
          '<div class="trash-row-info">' +
            '<div class="trash-row-name">' + escapeHtml(entry.page.title) + '</div>' +
            '<div class="trash-row-meta"><span class="pageid">' + escapeHtml(entry.page.pageId) + '</span> &middot; deleted ' + timeAgo(entry.deletedAt) + '</div>' +
          '</div>' +
          '<div class="trash-row-actions"><button type="button" class="restore">Restore</button></div>' +
        '</div>';
      });
    }
    html += '</div>';

    html += '<div class="trash-section"><h3 class="trash-section-head">Quests</h3>';
    if(!store.trashedQuests.length){
      html += '<div class="trash-empty">Nothing deleted.</div>';
    } else {
      store.trashedQuests.forEach(function(entry, i){
        html += '<div class="trash-row" data-type="quest" data-index="' + i + '">' +
          '<div class="trash-row-info">' +
            '<div class="trash-row-name">' + escapeHtml(entry.quest.name || 'Untitled Quest') + '</div>' +
            '<div class="trash-row-meta">deleted ' + timeAgo(entry.deletedAt) + '</div>' +
          '</div>' +
          '<div class="trash-row-actions"><button type="button" class="restore">Restore</button></div>' +
        '</div>';
      });
    }
    html += '</div>';

    html += '<div class="trash-section"><h3 class="trash-section-head">Questlines</h3>';
    if(!store.trashedQuestlines.length){
      html += '<div class="trash-empty">Nothing deleted.</div>';
    } else {
      store.trashedQuestlines.forEach(function(entry, i){
        html += '<div class="trash-row" data-type="questline" data-index="' + i + '">' +
          '<div class="trash-row-info">' +
            '<div class="trash-row-name">' + escapeHtml(entry.questline.name || 'Untitled Questline') + '</div>' +
            '<div class="trash-row-meta">deleted ' + timeAgo(entry.deletedAt) + '</div>' +
          '</div>' +
          '<div class="trash-row-actions"><button type="button" class="restore">Restore</button></div>' +
        '</div>';
      });
    }
    html += '</div>';

    elTrashList.innerHTML = html;
  }

  document.getElementById('trash-btn').addEventListener('click', function(){
    renderTrashList();
    elTrashBackdrop.classList.add('open');
  });
  document.getElementById('trash-close').addEventListener('click', function(){
    elTrashBackdrop.classList.remove('open');
  });
  elTrashBackdrop.addEventListener('mousedown', function(e){
    if(e.target === elTrashBackdrop) elTrashBackdrop.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && elTrashBackdrop.classList.contains('open')) elTrashBackdrop.classList.remove('open');
  });
  elTrashList.addEventListener('click', function(e){
    var row = e.target.closest('.trash-row');
    if(!row) return;
    if(!e.target.closest('.restore')) return;
    var index = Number(row.dataset.index);
    var type = row.dataset.type;
    if(type === 'page'){
      restorePage(index);
      return;
    }
    if(type === 'quest'){
      restoreQuestFromTrash(index);
      flashStatus('Quest restored', 1800);
    } else if(type === 'questline'){
      restoreQuestlineFromTrash(index);
      flashStatus('Questline restored', 1800);
    }
    // Quest/questline restores touch the store, not the live canvas state —
    // if the library is open behind this panel, refresh it so the restored
    // item shows up without needing to close and reopen Restore.
    if(state.view === 'library') renderLibrary();
    renderTrashList();
  });

  /* ================= view switching ================= */
  var elLibraryView = document.getElementById('library-view');
  var elWorldView = document.getElementById('world-view');
  var elAddCardBtn = document.getElementById('add-card-btn');
  var elClearCrossBtn = document.getElementById('clear-cross-btn');
  var elRelayoutBtn = document.getElementById('relayout-btn');

  /* "Re-arrange by flow", "Clear cross-quest arrows" and "Restore Pages" live
     together under one "Options" menu so the topbar doesn't grow a button
     per action. The first two still hide themselves per-view exactly as
     before (see updateTopbarForView below) — only their container moved. */
  var elOptionsBtn = document.getElementById('options-btn');
  var elOptionsMenu = document.getElementById('options-menu');

  function closeOptionsMenu(){
    elOptionsMenu.hidden = true;
    elOptionsBtn.setAttribute('aria-expanded', 'false');
  }
  elOptionsBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = elOptionsMenu.hidden;
    elOptionsMenu.hidden = !willOpen;
    elOptionsBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });
  // Any item click both runs that item's own handler (attached elsewhere,
  // unchanged) and closes the menu afterward.
  elOptionsMenu.addEventListener('click', function(e){
    if(e.target.closest('.dropdown-item')) closeOptionsMenu();
  });
  document.addEventListener('click', function(e){
    if(!elOptionsMenu.hidden && !e.target.closest('#options-dropdown')) closeOptionsMenu();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !elOptionsMenu.hidden) closeOptionsMenu();
  });

  /* "+ Page" only makes sense when a single quest is open — inside a
     whole-questline view it would be ambiguous which quest a new page
     belongs to, so it's hidden there. (Importing a .md now lives in the
     library, since it always creates a new standalone quest rather than
     acting on whatever's currently open.) */
  var elNavLibraryPill = document.getElementById('nav-library-pill');
  var elNavWorldPill = document.getElementById('nav-world-pill');

  function updateTopbarForView(){
    var singleQuest = state.view === 'canvas' && !state.activeQuestlineId;
    var wholeQuestline = state.view === 'canvas' && !!state.activeQuestlineId;
    if(elAddCardBtn) elAddCardBtn.style.display = singleQuest ? '' : 'none';
    if(elRelayoutBtn) elRelayoutBtn.style.display = singleQuest ? '' : 'none';
    if(elClearCrossBtn) elClearCrossBtn.style.display = wholeQuestline ? '' : 'none';
    if(elNavLibraryPill) elNavLibraryPill.classList.toggle('active', state.view === 'library');
    if(elNavWorldPill) elNavWorldPill.classList.toggle('active', state.view === 'world' || state.view === 'world-item');
    // the current-quest subheader only makes sense while something is open
    // on the canvas — it's empty (and hidden via #quest-pill:empty) in the library and the world section
    if(elQuestPill) elQuestPill.style.display = (state.view === 'library' || state.view === 'world' || state.view === 'world-item') ? 'none' : '';
  }

  function showCanvasView(){
    state.view = 'canvas';
    elLibraryView.classList.remove('open');
    if(elWorldView) elWorldView.classList.remove('open');
    elViewport.style.display = '';
    updateTopbarForView();
  }

  function showLibraryView(){
    closeConnLabelChooser();
    // flush whatever's on the canvas before leaving it, so a rename or
    // edit made moments ago is reflected when the library reloads from storage
    if(state.questId || state.activeQuestlineId){
      if(autosaveTimer){ clearTimeout(autosaveTimer); autosaveTimer = null; }
      persistCurrent();
    }
    // Nothing is "open" on the canvas while the library is showing. This
    // matters because the library edits the store directly (rename,
    // assign to a questline) without touching `state` — if state.questId
    // stayed set, the next switchToQuest/switchToQuestline would see it,
    // re-persist this now-stale in-memory record, and clobber whatever was
    // just changed from the library (e.g. an assignment made moments ago).
    state.questId = null;
    state.activeQuestlineId = null;
    state.view = 'library';
    elViewport.style.display = 'none';
    if(elWorldView) elWorldView.classList.remove('open');
    elLibraryView.classList.add('open');
    updateTopbarForView();
    renderLibrary();
  }

  function questRowHtml(store, quest){

  /* Soft delete for a whole quest, mirroring removePage's page-level soft
     delete: the quest's full record (its pages, connections, and own page
     trash) moves out of store.quests and into store.trashedQuests rather
     than being discarded, so it's always recoverable from the Restore
     panel. Its questlineId is left untouched on the stored record — if
     that questline still exists at restore time, the quest quietly resumes
     membership; if not, it comes back standalone (see restoreQuestFromTrash). */
  function trashQuest(questId){
    var store = loadStore();
    var quest = store.quests[questId];
    if(!quest) return;
    delete store.quests[questId];
    store.trashedQuests.push({quest: quest, deletedAt: Date.now()});
    if(store.activeQuestId === questId) store.activeQuestId = null;
    saveStore(store);
  }

  function restoreQuestFromTrash(index){
    var store = loadStore();
    var entry = store.trashedQuests[index];
    if(!entry) return;
    var quest = entry.quest;
    if(quest.questlineId && !store.questlines[quest.questlineId]) quest.questlineId = null;
    store.quests[quest.id] = quest;
    store.trashedQuests.splice(index, 1);
    saveStore(store);
  }

  /* Soft delete for a questline. Unlike a quest, a questline is just a
     grouping shell — deleting it removes that shell but leaves its member
     quests intact, reassigning them to Standalone (same as manually
     clearing each one's questline dropdown) rather than dragging them into
     the trash too. Restoring the questline brings back the empty shell;
     any quests that were in it stay standalone unless reassigned by hand. */
  function trashQuestline(qlId){
    var store = loadStore();
    var ql = store.questlines[qlId];
    if(!ql) return;
    Object.keys(store.quests).forEach(function(qid){
      if(store.quests[qid].questlineId === qlId) store.quests[qid].questlineId = null;
    });
    delete store.questlines[qlId];
    store.trashedQuestlines.push({questline: ql, deletedAt: Date.now()});
    if(store.activeQuestlineId === qlId) store.activeQuestlineId = null;
    saveStore(store);
  }

  function restoreQuestlineFromTrash(index){
    var store = loadStore();
    var entry = store.trashedQuestlines[index];
    if(!entry) return;
    store.questlines[entry.questline.id] = entry.questline;
    store.trashedQuestlines.splice(index, 1);
    saveStore(store);
  }

  function renderLibrary(){
    var store = loadStore();
    var questIds = Object.keys(store.quests);

    var questlineIds = Object.keys(store.questlines);
    if(!questlineIds.length){
      elQuestlineGroups.innerHTML = '<div class="library-empty">No questlines yet. Create one, then assign quests to it below.</div>';
    } else {
      var qlHtml = '';
      questlineIds.forEach(function(qlId){
        var ql = store.questlines[qlId];
        var members = questIds.filter(function(qid){ return store.quests[qid].questlineId === qlId; })
          .map(function(qid){ return store.quests[qid]; });
        qlHtml += '<div class="questline-block' + (ql.collapsed ? ' collapsed' : '') + '" data-questline-id="' + qlId + '">' +
          '<div class="questline-head" data-role="head">' +
            '<span class="chev">&#9662;</span>' +
            '<span class="questline-name" data-role="name" tabindex="0" title="Click to rename">' + escapeHtml(ql.name || 'Untitled Questline') + '</span>' +
            '<button class="btn primary" type="button" data-role="open-questline"' + (members.length ? '' : ' disabled title="Add a quest to this questline first"') + '>Open questline</button>' +
            '<button class="btn quiet-danger" type="button" data-role="delete-questline" title="Delete questline (its quests become standalone, not deleted)">&times;</button>' +
          '</div>' +
          '<div class="quest-list">' +
            (members.length ? members.map(function(q){ return questRowHtml(store, q); }).join('') : '<div class="library-empty">No quests assigned yet.</div>') +
          '</div>' +
        '</div>';
      });
      elQuestlineGroups.innerHTML = qlHtml;
    }

    var standalone = questIds.filter(function(qid){ return !store.quests[qid].questlineId; }).map(function(qid){ return store.quests[qid]; });
    elStandaloneQuests.innerHTML = standalone.length
      ? standalone.map(function(q){ return questRowHtml(store, q); }).join('')
      : '<div class="library-empty">No standalone quests.</div>';
  }

  function startInlineRename(labelEl, onSave){
    var current = labelEl.textContent;
    var input = document.createElement('input');
    input.type = 'text';
    input.value = current;
    labelEl.replaceWith(input);
    input.focus();
    input.select();
    var done = false;
    function commit(){
      if(done) return;
      done = true;
      var next = input.value.trim() || current;
      onSave(next);
      renderLibrary();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ done = true; renderLibrary(); }
    });
  }

  document.getElementById('new-questline-btn').addEventListener('click', function(){

    renderLibrary();
  });

  elQuestlineGroups.addEventListener('click', function(e){
    var nameEl = e.target.closest('.questline-name');
    if(nameEl){
      // Capture the questline id up front, before startInlineRename swaps
      // nameEl out of the DOM for an <input> — once detached, nameEl has no
      // parent chain left, so looking it up via nameEl.closest(...) inside
      // the onSave callback (which runs later, after the swap) throws.
      var qlIdForRename = nameEl.closest('.questline-block').dataset.questlineId;
      startInlineRename(nameEl, function(next){
        var store = loadStore();
        if(store.questlines[qlIdForRename]){ store.questlines[qlIdForRename].name = next; saveStore(store); }
      });
      return;
    }
    var openQuestline = e.target.closest('[data-role="open-questline"]');
    if(openQuestline){
      var qlBlock = openQuestline.closest('.questline-block');
      switchToQuestline(qlBlock.dataset.questlineId);

    var deleteQuestline = e.target.closest('[data-role="delete-questline"]');
    if(deleteQuestline){
      var qlId3 = deleteQuestline.closest('.questline-block').dataset.questlineId;
      if(confirmDangerClick(deleteQuestline)){
        trashQuestline(qlId3);
        flashStatus('Questline moved to trash', 2000);
        renderLibrary();

      return;
    }
    var head = e.target.closest('.questline-head');
    if(head && !e.target.closest('button')){
      var block = head.closest('.questline-block');
      var isCollapsed = block.classList.toggle('collapsed');

        saveStore(store2);

  // A sandboxed artifact page can't rely on window.confirm() (it's silently
  // suppressed rather than shown), so any destructive action in the library
  // (deleting a quest or a questline) uses the same arm-then-confirm pattern
  // as the world item delete button below: the first click just puts that
  // one button into a "Confirm?" state for a few seconds, and only a second
  // click on the SAME still-armed button actually does it.
  var armedDeleteBtn = null;
  var armedDeleteTimer = null;
  function resetArmedDelete(){
    if(armedDeleteBtn){
      armedDeleteBtn.textContent = armedDeleteBtn.dataset.origLabel || '×';
      armedDeleteBtn.classList.remove('armed');
    }
    armedDeleteBtn = null;
    if(armedDeleteTimer){ clearTimeout(armedDeleteTimer); armedDeleteTimer = null; }
  }
  // Returns true when this click is the confirming second click (caller
  // should perform the delete); false when it just armed the button.
  function confirmDangerClick(btn){
    if(armedDeleteBtn === btn){
      resetArmedDelete();
      return true;
    }
    resetArmedDelete();
    armedDeleteBtn = btn;
    btn.dataset.origLabel = btn.textContent;
    btn.textContent = 'Confirm?';
    btn.classList.add('armed');
    armedDeleteTimer = setTimeout(resetArmedDelete, 4000);
    return false;
  }

  function handleQuestRowClick(e){
    var nameEl = e.target.closest('.quest-name');
    var row = e.target.closest('.quest-row');
    if(!row) return;
    var questId = row.dataset.questId;
    var deleteBtn = e.target.closest('[data-role="delete-quest"]');
    if(deleteBtn){
      if(confirmDangerClick(deleteBtn)){
        trashQuest(questId);
        flashStatus('Quest moved to trash', 2000);
        renderLibrary();
      }
      return;
    }
    if(nameEl){
      startInlineRename(nameEl, function(next){
        var store = loadStore();
        if(store.quests[questId]){ store.quests[questId].name = next; saveStore(store); }
      });
      return;
    }
    if(e.target.closest('[data-role="open-quest"]')){
      switchToQuest(questId);
    }
  }

  /* ================= world view (Factions / NPCs / Locations) =================
     A simple directory + item-detail pair of views, built the same way the
     Story library is: plain rows read straight from the store, re-rendered
     on every change rather than kept in sync incrementally. Persisted in the
     same localStorage-backed store as everything else (store.world), so no
     new persistence mechanism is introduced. */
  var WORLD_SCHEMAS = {
    factions: {
      label: 'Factions', singular: 'Faction', newName: 'New Faction',
      fields: [
        {key: 'name', label: 'Name', type: 'text'},
        {key: 'ideasGoals', label: 'Ideas & Goals', type: 'textarea'},
        {key: 'symbol', label: 'Symbol/Emblem', type: 'text'},
        {key: 'colors', label: 'Color(s)', type: 'text'},
        {key: 'motto', label: 'Motto', type: 'text'},
        {key: 'enemyCreatures', label: 'Enemy Creatures', type: 'textarea'},
        {key: 'mount', label: 'Mount', type: 'text'},
        {key: 'hqBuildings', label: 'HQ & Buildings', type: 'textarea'},
        {key: 'orgHierarchy', label: 'Org Hierarchy', type: 'textarea'},
        {key: 'people', label: 'People (Leaders & Members)', type: 'textarea'}
      ],
      subtitle: function(item){ return item.ideasGoals ? truncateForRow(item.ideasGoals) : ''; }
    },
    npcs: {
      label: 'NPCs', singular: 'NPC', newName: 'New NPC',
      fields: [
        {key: 'name', label: 'Name', type: 'text'},
        {key: 'role', label: 'Role / Title', type: 'text'},
        {key: 'description', label: 'Description', type: 'textarea'},
        {key: 'affiliation', label: 'Faction', type: 'faction-select'},
        {key: 'location', label: 'Location', type: 'text'},
        {key: 'notes', label: 'Notes', type: 'textarea'}
      ],
      subtitle: function(item, store){
        var parts = [];
        if(item.role) parts.push(item.role);
        var factionName = item.affiliation ? factionNameById(store, item.affiliation) : '';
        if(factionName) parts.push(factionName);
        return parts.join(' · ');
      }
    },
    locations: {
      label: 'Locations', singular: 'Location', newName: 'New Location',
      fields: [
        {key: 'name', label: 'Name', type: 'text'},
        {key: 'regionType', label: 'Region / Type', type: 'text'},
        {key: 'description', label: 'Description', type: 'textarea'},
        {key: 'faction', label: 'Faction', type: 'faction-select'},
        {key: 'notablePresence', label: 'Notable NPCs / Factions', type: 'textarea'},
        {key: 'notes', label: 'Notes', type: 'textarea'}
      ],
      subtitle: function(item, store){
        var parts = [];
        if(item.regionType) parts.push(item.regionType);
        var factionName = item.faction ? factionNameById(store, item.faction) : '';
        if(factionName) parts.push(factionName);
        return parts.join(' · ');
      }
    }
  };
  var WORLD_CATEGORIES = ['factions', 'npcs', 'locations'];

  function truncateForRow(s){
    s = String(s || '').replace(/\s+/g, ' ').trim();
    return s.length > 60 ? s.slice(0, 57) + '…' : s;
  }

  /* Resolves a faction id (stored on an NPC's "Faction" field or a
     Location's "Faction" field) to that faction's current name, so
     renaming a faction is reflected everywhere it's referenced instead of
     baking the old name in at selection time. Returns '' for a blank id
     or one that no longer matches any faction (e.g. the faction was
     deleted, or — for data typed in before this was a dropdown — the id
     column now holds old free-text that was never a real faction id). */
  function factionNameById(store, id){
    var f = (store.world.factions || {})[id];
    return f ? (f.name || 'Untitled Faction') : '';
  }

  function factionSelectOptionsHtml(store, selectedId){
    var factions = store.world.factions || {};
    var ids = Object.keys(factions);
    var html = '<option value="">— None —</option>';
    ids.forEach(function(fid){
      html += '<option value="' + fid + '"' + (fid === selectedId ? ' selected' : '') + '>' +
        escapeHtml(factions[fid].name || 'Untitled Faction') + '</option>';
    });
    return html;
  }

  /* Finds every item in a category (npcs or locations) whose faction-select
     field (keyField) points at this faction — the reverse lookup that lets a
     faction's own page show "who/what actually links here" without a real
     relational DB, following the same id + filter pattern already used for
     quest page connections (see pageById/renderWires). */
  function itemsForFaction(store, category, keyField, factionId){
    var items = store.world[category] || {};
    return Object.keys(items)
      .filter(function(id){ return items[id][keyField] === factionId; })
      .map(function(id){ return {id: id, item: items[id]}; });
  }

  /* Renders a faction detail's supplementary "linked items" list — clickable
     names of NPCs/Locations that reference this faction — shown below the
     existing free-text field, in view mode only (never in the edit form,
     since these links are derived, not something to hand-edit here). */
  function linkedListHtml(category, entries, label){
    if(!entries.length) return '';
    var html = '<div class="linked-list"><div class="linked-list-label">' + escapeHtml(label) + '</div>';
    entries.forEach(function(e){
      var name = e.item.name || 'Untitled';
      html += '<button type="button" class="linked-item" data-category="' + category + '" data-id="' + e.id + '">' +
        escapeHtml(name) + '</button>';
    });
    html += '</div>';
    return html;
  }

  function renderWorldDirectory(){
    var store = loadStore();

        return '<div class="world-item-row" data-category="' + cat + '" data-id="' + id + '">' +

  /* Renders the current world-item detail view. Always rebuilds both the
     read-only view and the (hidden unless active) edit form from the store,
     so switching items or re-entering the view never shows stale data. */
  function renderWorldDetail(edit){
    var category = state.worldCategory;
    var store = loadStore();
    var item = (store.world[category] || {})[state.worldItemId];
    if(!item){ showWorldView(); return; }
    var schema = WORLD_SCHEMAS[category];

    elWorldDetailCrumbCategory.textContent = schema.label;
    elWorldDetailCrumbName.textContent = item.name || 'Untitled ' + schema.singular;
    elWorldDetailKind.textContent = schema.singular;
    elWorldDetailTitle.textContent = item.name || 'Untitled ' + schema.singular;

    var fieldsHtml = '';
    schema.fields.forEach(function(f){
      if(f.key === 'name') return; // name is already the page title above
      var displayVal = f.type === 'faction-select'
        ? (item[f.key] ? factionNameById(store, item[f.key]) : '')
        : (item[f.key] || '');
      var extraHtml = '';
      // Faction pages only: supplement the free-text HQ & Buildings / People
      // fields with a live, clickable list of the Locations/NPCs that
      // actually reference this faction — additive, not a replacement, and
      // view-mode only (edit() form below never gets this).
      if(category === 'factions'){
        if(f.key === 'hqBuildings'){
          extraHtml = linkedListHtml('locations', itemsForFaction(store, 'locations', 'faction', state.worldItemId), 'Linked Locations');
        } else if(f.key === 'people'){
          extraHtml = linkedListHtml('npcs', itemsForFaction(store, 'npcs', 'affiliation', state.worldItemId), 'Linked NPCs');
        }
      }
      fieldsHtml += '<div class="world-field"><label>' + escapeHtml(f.label) + '</label>' +
        '<div class="value">' + escapeHtml(displayVal) + '</div>' + extraHtml + '</div>';
    });
    elWorldDetailFields.innerHTML = fieldsHtml;

    var editHtml = '';
    schema.fields.forEach(function(f){
      var val = escapeHtml(item[f.key] || '');
      var control;
      if(f.type === 'textarea'){
        control = '<textarea id="world-edit-' + f.key + '" data-key="' + f.key + '" rows="3">' + val + '</textarea>';
      } else if(f.type === 'faction-select'){
        control = '<select id="world-edit-' + f.key + '" data-key="' + f.key + '">' + factionSelectOptionsHtml(store, item[f.key] || '') + '</select>';
      } else {
        control = '<input type="text" id="world-edit-' + f.key + '" data-key="' + f.key + '" value="' + val + '">';
      }
      editHtml += '<div class="modal-row"><label for="world-edit-' + f.key + '">' + escapeHtml(f.label) + '</label>' + control + '</div>';
    });
    elWorldDetailEditFields.innerHTML = editHtml;

    resetWorldDeleteArm();
    setWorldDetailEditing(!!edit);
  }

  function setWorldDetailEditing(editing){
    elWorldDetailViewMode.hidden = editing;

  elWorldDetailFields.addEventListener('click', function(e){
    var link = e.target.closest('.linked-item');
    if(link) showWorldItem(link.dataset.category, link.dataset.id);
  });

  elWorldDetailEditBtn.addEventListener('click', function(){ setWorldDetailEditing(true); });
  elWorldDetailCancelBtn.addEventListener('click', function(){ renderWorldDetail(false); });

  elWorldDetailSaveBtn.addEventListener('click', function(){
    var category = state.worldCategory, id = state.worldItemId;
    var schema = WORLD_SCHEMAS[category];
    var store = loadStore();
    var item = (store.world[category] || {})[id];
    if(!item) return;
    schema.fields.forEach(function(f){
      var el = document.getElementById('world-edit-' + f.key);
      if(!el) return;
      item[f.key] = el.value;
    });
    if(!item.name || !item.name.trim()) item.name = 'Untitled ' + schema.singular;
    saveStore(store);
    flashSaved();
    renderWorldDetail(false);
  });

  // A sandboxed artifact page can't rely on window.confirm() (it's silently
  // suppressed rather than shown), so deletion is armed by a first click and
  // only actually happens on a second click shortly after — same "are you
  // sure" safety net as a confirm dialog, just built from a plain button
  // instead of one.
  var worldDeleteArmed = false;
  var worldDeleteArmTimer = null;
  function resetWorldDeleteArm(){
    worldDeleteArmed = false;
    if(worldDeleteArmTimer){ clearTimeout(worldDeleteArmTimer); worldDeleteArmTimer = null; }
    if(elWorldDetailDeleteBtn) elWorldDetailDeleteBtn.textContent = 'Delete';
  }
  elWorldDetailDeleteBtn.addEventListener('click', function(){
    var category = state.worldCategory, id = state.worldItemId;
    if(!worldDeleteArmed){
      worldDeleteArmed = true;
      elWorldDetailDeleteBtn.textContent = 'Click again to confirm delete';
      worldDeleteArmTimer = setTimeout(resetWorldDeleteArm, 4000);
      return;
    }
    resetWorldDeleteArm();
    var store = loadStore();
    if(store.world[category]) delete store.world[category][id];
    saveStore(store);
    showWorldView();
  });

  elWorldDetailCrumbWorld.addEventListener('click', showWorldView);

  // The category crumb (e.g. "Locations") has no page of its own — Factions/
  // NPCs/Locations are just sections on the one World directory page — so
  // rather than being inert, clicking it goes back to that directory and
  // scrolls straight to the matching section heading, same as clicking
  // "World" but landing you where you were instead of at the top.
  elWorldDetailCrumbCategory.addEventListener('click', function(){
    var cat = state.worldCategory;
    showWorldView();
    var target = document.getElementById('world-section-' + cat);
    if(target) target.scrollIntoView({behavior: 'smooth', block: 'start'});
  });

  document.getElementById('world-directory').addEventListener('click', function(e){
    var addBtn = e.target.closest('[data-role="add-world-item"]');
    if(addBtn){
      var category = addBtn.dataset.category;
      var schema = WORLD_SCHEMAS[category];
      var store = loadStore();
      var id = genId();
      var item = {id: id, name: schema.newName};
      schema.fields.forEach(function(f){ if(!(f.key in item)) item[f.key] = ''; });
      store.world[category][id] = item;
      saveStore(store);
      showWorldItem(category, id);
      renderWorldDetail(true);
      return;
    }
    var row = e.target.closest('.world-item-row');
    if(row) showWorldItem(row.dataset.category, row.dataset.id);
  });

  /* ================= file import ================= */
  // Importing a .md draft always creates a brand-new standalone quest, never
  // acts on whatever's currently open — so the control lives in the library
  // rather than the canvas topbar. Importing a real quest .json is keyed by
  // its filename instead (the QuestLines convention: quest id == filename),
  // so re-importing the same file updates that quest in place rather than
  // piling up duplicates.
  var elFileInput = document.getElementById('file-input');

  /* If the quest JSON declares a QuestlineId, honor it even on a single-file
     import: find or create that questline (using QuestlineTitle for its
     name) so the quest lands where the source data says it belongs, rather
     than always dropping it into Standalone quests. */
  function resolveQuestlineForJson(store, qj){
    if(!qj.QuestlineId) return null;
    if(!store.questlines[qj.QuestlineId]){
      store.questlines[qj.QuestlineId] = {id: qj.QuestlineId, name: qj.QuestlineTitle || qj.QuestlineId, connections: []};
    } else if(qj.QuestlineTitle){
      store.questlines[qj.QuestlineId].name = qj.QuestlineTitle;
    }
    return qj.QuestlineId;
  }

  document.getElementById('import-quest-btn').addEventListener('click', function(){ elFileInput.click(); });
  elFileInput.addEventListener('change', function(){
    var file = elFileInput.files[0];
    if(!file) return;
    var isJson = /\.json$/i.test(file.name);
    var reader = new FileReader();
    reader.onload = function(){
      if(isJson){
        var qj;
        try{ qj = JSON.parse(String(reader.result)); }
        catch(e){ flashStatus('Could not parse "' + file.name + '" as JSON', 4000); return; }
        var questId = file.name.replace(/\.json$/i, '');
        var questName = qj.Title || questId;
        var built = buildQuestFromJson(qj);
        var store = loadStore();
        var questlineId = resolveQuestlineForJson(store, qj);
        saveStore(store);
        try{
          importOrUpdateQuest(questId, questName, built, questlineId);
          switchToQuest(questId);
        } catch(saveErr){
          flashStatus('Could not import "' + file.name + '": ' + saveErr.message, 6000);
        }
      } else {
        var name = file.name.replace(/\.(md|txt)$/i, '');
        loadFromMarkdown(String(reader.result), {questId: genId(), questName: name});
        persistCurrent();
        showCanvasView();
      }
    };
    reader.readAsText(file);
    elFileInput.value = '';
  });

  /* ---- questline folder import ---- */
  // Groups the selected folder's *.json files by their own QuestlineId
  // (usually all the same, but handled per-group in case a folder ever
  // mixes quests from more than one questline), imports/updates every
  // member quest, then auto-draws cross-quest arrows from any
  // questStarted:/questCompleted:/questNotStarted:/questNotCompleted:
  // requirement that references a sibling quest in the same group.
  var elFolderInput = document.getElementById('folder-input');
  document.getElementById('import-questline-btn').addEventListener('click', function(){ elFolderInput.click(); });
  elFolderInput.addEventListener('change', function(){
    var files = Array.prototype.filter.call(elFolderInput.files, function(f){ return /\.json$/i.test(f.name); });
    if(!files.length){ elFolderInput.value = ''; return; }
    var readers = files.map(function(f){
      return new Promise(function(resolve){
        var r = new FileReader();
        r.onload = function(){
          var qj = null;
          var parseError = null;
          try{ qj = JSON.parse(String(r.result)); } catch(e){ parseError = e.message; }
          resolve({name: f.name, qj: qj, parseError: parseError});
        };
        // Without this, a file the OS can't read (permissions, a transient
        // lock, etc.) leaves its promise forever unresolved, which hangs
        // Promise.all and silently stalls the whole import with no feedback.
        r.onerror = function(){
          resolve({name: f.name, qj: null, readError: (r.error && r.error.message) || 'could not be read'});
        };
        r.readAsText(f);
      });
    });
    Promise.all(readers).then(function(results){
      var groups = {}; // QuestlineId -> [{questId, qj}]
      var skipped = []; // "filename: reason" for anything that never made it into a group
      results.forEach(function(r){
        if(r.readError){ skipped.push(r.name + ': ' + r.readError); return; }
        if(r.parseError){ skipped.push(r.name + ': not valid JSON (' + r.parseError + ')'); return; }
        if(!r.qj || !r.qj.PageData){ skipped.push(r.name + ': no PageData, not a quest file'); return; }
        if(!r.qj.QuestlineId){ skipped.push(r.name + ': no QuestlineId (import it as a standalone quest instead)'); return; }
        var questId = r.name.replace(/\.json$/i, '');
        (groups[r.qj.QuestlineId] = groups[r.qj.QuestlineId] || []).push({questId: questId, qj: r.qj});
      });
      var groupIds = Object.keys(groups);
      if(!groupIds.length){
        flashStatus('No quest .json files with a QuestlineId were found in that folder' + (skipped.length ? (' — ' + skipped.join('; ')) : ''), 6000);
        elFolderInput.value = '';
        return;
      }
      var importedCount = 0;
      groupIds.forEach(function(qlId){
        var members = groups[qlId];
        var store = loadStore();
        var title = (members.map(function(m){ return m.qj.QuestlineTitle; }).filter(Boolean)[0]) || qlId;
        if(!store.questlines[qlId]) store.questlines[qlId] = {id: qlId, name: title, connections: []};
        else store.questlines[qlId].name = title;
        if(!saveStore(store)) skipped.push(qlId + ': could not save to this browser (storage may be full)');

        var idByQuestId = {}; // sibling questId -> its Pages[0] internal page id, filled in after each build
        var builtByQuestId = {};
        // One bad member (an unexpected shape buildQuestFromJson doesn't
        // handle, or a failed save) used to throw out of this forEach and
        // silently abort every quest after it in the same folder — that's
        // almost certainly what happened if some quests in a questline
        // import land and later ones just don't: isolate each member so one
        // failure only skips that one file and everything else still runs.
        members.forEach(function(m){
          try{
            var built = buildQuestFromJson(m.qj);
            builtByQuestId[m.questId] = built;
            var ok = true;
            try{ importOrUpdateQuest(m.questId, m.qj.Title || m.questId, built, qlId); }
            catch(saveErr){ ok = false; skipped.push(m.questId + ': ' + saveErr.message); }
            if(ok){
              importedCount++;
              var firstJsonPageId = (m.qj.Pages && m.qj.Pages[0]) || Object.keys(m.qj.PageData || {})[0];
              var firstPage = built.pages.filter(function(p){ return p.pageId === firstJsonPageId; })[0];
              if(firstPage) idByQuestId[m.questId] = firstPage.id;
            }
          } catch(buildErr){
            skipped.push(m.questId + ': ' + buildErr.message);
          }
        });

        // Second pass: cross-quest arrows, now that every member's pages exist.
        var crossConns = [];
        members.forEach(function(m){
          if(!builtByQuestId[m.questId]) return; // this member failed above, nothing to draw from
          var qj = m.qj;
          Object.keys(qj.PageData || {}).forEach(function(pid){
            var pd = qj.PageData[pid];
            var built = builtByQuestId[m.questId];
            var fromPage = built.pages.filter(function(p){ return p.pageId === pid; })[0];
            if(!fromPage) return;
            var refs = findQuestStateRefs(pd.Requirements);
            refs.forEach(function(ref){
              var targetQuestId = members.some(function(mm){ return mm.questId === ref.questId; }) ? ref.questId : null;
              if(!targetQuestId || targetQuestId === m.questId) return; // only sibling quests in this same group
              var toId = idByQuestId[targetQuestId];
              if(!toId) return;
              var exists = crossConns.some(function(c){ return c.from === fromPage.id && c.to === toId; });
              if(exists) return;
              crossConns.push({id: 'w' + (state.nextConnId++), from: fromPage.id, to: toId, fromSide: 'right', toSide: 'left', _cross: true, label: ref.raw});
            });
          });
        });
        var store2 = loadStore();
        if(store2.questlines[qlId]) store2.questlines[qlId].connections = crossConns;
        store2.nextPageId = state.nextPageId;
        store2.nextConnId = state.nextConnId;
        if(!saveStore(store2)) skipped.push(qlId + ': cross-quest arrows could not be saved (storage may be full)');
      });
      var summary = 'Imported ' + importedCount + ' quest' + (importedCount === 1 ? '' : 's') +
        ' across ' + groupIds.length + ' questline' + (groupIds.length === 1 ? '' : 's');
      if(skipped.length) summary += ' — skipped: ' + skipped.join('; ');
      flashStatus(summary, skipped.length ? 8000 : 2200);
      renderLibrary();
      elFolderInput.value = '';
    }).catch(function(err){
      flashStatus('Questline import failed: ' + err.message, 6000);
      elFolderInput.value = '';
    });
  });

  document.getElementById('add-card-btn').addEventListener('click', openNewCardEditor);

  // Bulk removal for cross-quest arrows: one-by-one deletion (select a wire,
  // click its × ) works but a questline can easily auto-draw more of these
  // than anyone wants to click through by hand. Only touches connections
  // tagged _cross — every member quest's own pages and same-quest arrows are
  // untouched, and this only exists to remove in the current whole-questline
  // view, so it's a no-op outside one.
  if(elClearCrossBtn) elClearCrossBtn.addEventListener('click', function(){
    if(!state.activeQuestlineId) return;
    var before = state.connections.length;
    state.connections = state.connections.filter(function(c){ return !c._cross; });
    if(state.connections.length === before) return;
    state.selectedConn = null;
    closeConnLabelChooser();
    renderWires();
    persistCurrentQuestline();
    flashStatus('Cleared cross-quest arrows', 1800);
  });

  // Re-import intentionally preserves a page's existing position once it's
  // been imported once (that's what keeps hand-arranged layouts from being
  // clobbered by a routine re-import) — which means the improved,
  // arrow-following layout order only ever applies to genuinely new pages.
  // This is the explicit opt-in for applying it to an already-imported
  // quest's existing pages too, since a re-import alone won't.
  if(elRelayoutBtn) elRelayoutBtn.addEventListener('click', function(){
    if(!state.questId) return;
    var ordered = orderPagesByFlow(state.pages, state.connections);
    layoutPages(ordered);
    fitViewToPages(state.pages);
    applyTransform();
    renderAll();
    persistCurrentQuest();
    flashStatus('Re-arranged by dialogue flow', 1800);
  });

  /* ================= theme toggle ================= */
  var THEME_KEY = 'storymapper-theme';
  var THEME_KEY_OLD = 'dialogue-loom-theme';
  function getStoredTheme(){
    try {
      var v = localStorage.getItem(THEME_KEY);
      if(v) return v;
      var legacy = localStorage.getItem(THEME_KEY_OLD);
      if(legacy){
        localStorage.setItem(THEME_KEY, legacy);
        localStorage.removeItem(THEME_KEY_OLD);
        return legacy;
      }
      return null;
    } catch(e){ return null; }
  }
  function setStoredTheme(v){
    try { localStorage.setItem(THEME_KEY, v); } catch(e){}
  }
  function systemPrefersDark(){
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    var btn = document.getElementById('theme-toggle');
    if(btn) btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  }
  (function initTheme(){
    var stored = getStoredTheme();
    var initial = (stored === 'light' || stored === 'dark') ? stored : (systemPrefersDark() ? 'dark' : 'light');
    applyTheme(initial);
  })();
  document.getElementById('theme-toggle').addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    setStoredTheme(next);
  });

  /* ================= boot ================= */
  (function boot(){
    var store = loadStore();
    // seed the global id counters once at startup; from here on they only
    // ever move forward, mirrored into the store on every save
    state.nextPageId = store.nextPageId;
    state.nextConnId = store.nextConnId;

    var openedQuestline = store.activeQuestlineId && store.questlines[store.activeQuestlineId]
      && switchToQuestline(store.activeQuestlineId);
    if(!openedQuestline){
      // re-read: switchToQuestline may have already flushed/changed things above
      var store2 = loadStore();
      var active = store2.activeQuestId ? store2.quests[store2.activeQuestId] : null;
      if(active){
        restoreQuest(active);
      } else {
        var defaultMd = document.getElementById('default-md').textContent;
        loadFromMarkdown(defaultMd, {questId: 'seed-meet-the-mercs', questName: 'Meet the Mercs'});
      }
    }
    // The app always opens on the library rather than dropping straight
    // back into whatever quest/questline was open last session — the block
    // above still restores that quest/questline into `state` (and seeds the
    // default quest on a first-ever launch) so its data is loaded and
    // available the moment it's picked from the library, but the canvas
    // itself isn't shown until the user actually chooses something.
    showLibraryView();
  })();
})();
</script>
</body></html>
